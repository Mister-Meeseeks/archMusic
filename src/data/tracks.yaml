# ---------- Vol I ch. 4: auditory scene analysis ----------

- id: tchaik6-finale
  title: Symphony No. 6 in B minor "Pathétique", Op. 74, IV. Finale (Adagio lamentoso)
  artist: Pyotr Ilyich Tchaikovsky; Royal Liverpool Philharmonic Orchestra, Vasily Petrenko
  year: 1893
  youtube: 6MdFJHvMOPg        # Vasily Petrenko - Topic (The Orchard / Onyx), 11:40
  spotify: 1QWBzTNBwrNBHE3rGm6Kas  # Tchaikovsky Symphony No.6 'Pathetique', No.4, No.3 'Polish' (2017), 11:39
  search: Tchaikovsky Symphony 6 Pathetique Finale Adagio lamentoso Petrenko Royal Liverpool
  rights: embed-official
  listened: false
  notes: The opening bars (roughly 0:00-0:30, an estimate) are the passage where the 1st and 2nd violins trade notes of the descending melody, so neither part plays the tune on its own, yet you hear a single smooth line; the same passage returns near the end of the movement. Same recording on YouTube and Spotify. Alternative (Karajan/Berlin Phil 1977 DG, Berliner Philharmoniker - Topic, BZHhkv5umMA, 9:53) has no confirmed matching Spotify track; Spotify 23HgRRO1J6RLJyxk0UBIFT is a Karajan/Berlin 2007 compilation track (10:14), probably a different (EMI) recording.

- id: bach-partita3-prelude
  title: Violin Partita No. 3 in E major, BWV 1006, I. Preludio
  artist: Johann Sebastian Bach; Hilary Hahn
  year: 1997
  youtube: uju--tMDar8        # Hilary Hahn - Topic (Sony Classical, "Hilary Hahn Plays Bach"), 3:35
  spotify: 2sqhid2MBYJCZWPrLjsUbP  # Hilary Hahn Plays Bach (1997), 3:34
  search: Hilary Hahn Bach Partita No. 3 E major Preludio
  rights: embed-official
  listened: false
  notes: A single line of nonstop sixteenth notes that keeps leaping between strings, so it splits into a higher and a lower strand (pseudo-polyphony); listen especially for the bariolage stretches where one repeated open-string note alternates with a moving line. Find cue times by ear. Same recording on both. Alternative is Grumiaux (Philips, early 1960s), YouTube MrioumHEjgM (Arthur Grumiaux - Topic, 3:48, from "101 Bach") and Spotify 3anzrDNu9oU7Is5qoZqJGS (Complete Sonatas & Partitas for Solo Violin, 3:47). Probably the same recording but on a different compilation. A second Hahn Topic upload, AIBOk-Tdofw (3:30), is likely her later recording and doesn't match the Spotify track.

