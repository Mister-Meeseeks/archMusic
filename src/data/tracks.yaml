# ---------- Vol III ch. 3: melody ----------

- id: beethoven5-mvt1
  title: "Symphony No. 5 in C minor, Op. 67: I. Allegro con brio"
  artist: Ludwig van Beethoven; Berlin Philharmonic, Herbert von Karajan
  year: 1962
  youtube: 7pxWm5MZKW8        # Herbert von Karajan - Topic, "2024 Remastered, Berlin 1962" (7:16)
  spotify: 3dKRNpM0fWeMK8oHiI8ZNa  # Karajan A-Z: Beethoven (DG, 2024), "Recorded 1962" (7:18)
  search: Beethoven Symphony 5 Allegro con brio Karajan Berlin 1962
  rights: embed-official
  listened: false
  notes: >-
    The short-short-short-long motif opens the piece and drives nearly every bar. Karajan takes the
    exposition repeat. ESTIMATES (bar-count proportions; tempo assumed constant, fermatas ignored):
    the development starts around 2:50 (bar 125, after the repeated exposition), the recapitulation
    begins around 4:20, and the solo oboe cadenza (bar 268) comes around 4:30. Check these by ear
    (allow about ±10 s).

