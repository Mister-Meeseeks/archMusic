- id: shankar-jogeshwari-alap
  title: "Raga Jogeshwari: Alap"
  artist: Ravi Shankar (sitar)
  year: 1981
  youtube: 0SdVJfaYP7I        # Ravi Shankar - Topic (13:44)
  spotify: 6jCMpgXNqz3haixD4u5ZVi  # Traditional: The Spirit of India (1995 compilation) (13:43)
  search: Ravi Shankar Raga Jogeshwari Alap
  rights: embed-official
  listened: false
  notes: >-
    The unmetred ālāp opening unfolds the raga one note at a time, with meend (bends that slide between
    notes) and gamak (oscillations on a note). Ornament here is part of the melody's identity, not
    decoration added afterwards. The first two or three minutes are enough. The recording is DG's 1981
    "Raga Jogeshwari" (year inferred from the 1981 album listing on Spotify; verify). Other verified
    copies: youtube STSchUyJ8Qw (Topic, 13:41), spotify 2Pc7SEsDp6wRqRmLrOYlbR (2023 compilation).

