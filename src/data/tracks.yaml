- id: barbershop-tag
  title: Bring Him Home
  artist: Vocal Spectrum
  year: 2008
  youtube: G--fLTLTFkw        # Vocal Spectrum - Topic
  spotify: 3F2C3wITQ0NFaDoH9M8EZQ  # album: Vocal Spectrum
  search: Vocal Spectrum Bring Him Home
  rights: embed-official
  listened: false
  notes: >-
    Vocal Spectrum were the 2006 Barbershop Harmony Society international
    quartet champions. A slow ballad, so the chords are sustained long enough
    to lock and ring. The cue starts near the end for the final chord; that
    timestamp is an estimate from the track length and must be confirmed by
    ear. Alternative: Ringmasters (2012 champions) also recorded it, on their
    own channel (youtube DcV8JJKmAaA).

