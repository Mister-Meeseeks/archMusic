  notes: A looping Roland TB-303 bassline while DJ Pierre slowly sweeps the low-pass cutoff and resonance by hand, so the same notes go from muffled to squelchy and back. This is subtractive synthesis heard as a performance.

- id: dx7-epiano
  title: Twin Peaks Theme (Instrumental)
  artist: Angelo Badalamenti
  year: 1990
  youtube: Z30zg9a5M5k        # Angelo Badalamenti - Topic, 5:11
  spotify: 7FO7BolIZsl1o8DDSjeOph  # Soundtrack From Twin Peaks (1990), 5:10
  search: Angelo Badalamenti Twin Peaks Theme Instrumental
  rights: embed-official
  listened: false
  notes: The slow, chiming electric-piano chords (DX7 E.PIANO 1, an FM patch) carry the harmony under the twangy guitar melody. The patch should be exposed near the start (estimate, ~0:00–0:30); listen for the glassy "tine" attack that softens into a mellow sustain, the FM hallmark.

