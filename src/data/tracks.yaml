# Every recording referenced in the book.
#
# IDs are never guessed: each one is checked with `npm run verify-track`,
# which reads Spotify's public track page and YouTube's oEmbed endpoint.
# Prefer YouTube uploads from official channels: "<Artist> - Topic"
# (label-delivered, auto-generated by YouTube), VEVO, or the artist/label/orchestra.
#
# rights (breadcrumb for going public, see PUBLISHING.md):
#   embed-official    official upload by the artist/label; embedding is fine
#   embed-unofficial  fan upload; replace before going public
#   cc / public-domain / own   free to host or embed
#   recreation        our own MIDI/synth re-creation of a passage
#   unknown           decide before going public
#
# listened: set to true once a human has listened and confirmed the track
# (and cue timestamps) actually demonstrate the point. Metadata checks can
# prove a link is real, not that the example is good.

