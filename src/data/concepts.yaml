# Concept registry: every term the book relies on, and where it's introduced.
#
#   introducedIn  chapter id prefix (v<volume>-<chapter>) where a reader first
#                 learns it. v0-02 = the Overture's "Toolkit" primer.
#   deepIn        (optional) where it gets full treatment
#   aliases       words/phrases the lint (npm run concepts) looks for in chapter
#                 text. Plain words match whole words, case-insensitive. Keep
#                 them specific: avoid words with everyday meanings.
#
# Chapters declare `assumes:` (needs prior knowledge → shown in the chapter's
# refresher box) and `introduces:` (teaches it here) in frontmatter.

# ---------- sound ----------
- id: frequency
  term: Frequency (Hz)
  category: Sound
  introducedIn: v0-02
  deepIn: v1-01
  aliases: [frequency, frequencies, Hz, hertz]
  def: >-
    How many times per second a vibration repeats, measured in hertz (Hz).
    Higher frequency is heard as higher pitch. The A that orchestras tune to
    is 440 Hz; human hearing spans roughly 20 to 20,000 Hz.

- id: pitch
  term: Pitch
  category: Sound
  introducedIn: v0-02
  deepIn: v1-03
  aliases: [pitch, pitches]
  def: >-
    How high or low a note sounds. Pitch is mostly determined by frequency,
    but it is a perception, not a physical measurement.

- id: sine-wave
  term: Sine wave (pure tone)
  category: Sound
  introducedIn: v1-01
  aliases: [sine wave, sine waves, sine, pure tone, pure tones]
  def: >-
    The simplest possible sound: a single frequency with nothing else in it.
    It sounds like a tuning fork or a soft whistle. Every other sound can be
    built by adding sine waves together.

- id: harmonics
  term: Harmonics (partials, overtones)
  category: Sound
  introducedIn: v1-02
  aliases: [harmonics, partial, partials, overtone, overtones, fundamental, harmonic series]
  def: >-
    A note played on a real instrument contains its main frequency (the
    fundamental) plus fainter frequencies at whole-number multiples of it:
    2×, 3×, 4×, and so on (the harmonic series). They blend into one
    perceived note and give it its tone color.

- id: timbre
  term: Timbre
  category: Sound
  introducedIn: v1-02
  deepIn: v4-01
  aliases: [timbre, timbres]
  def: >-
    Tone color: what makes a violin and a flute sound different playing the
    same note at the same loudness. It depends largely on which harmonics are
    present and how they change over time.

- id: cochlea
  term: Cochlea
  category: Hearing
  introducedIn: v1-03
  aliases: [cochlea, basilar membrane]
  def: >-
    The snail-shaped organ of the inner ear that turns vibration into nerve
    signals. Its basilar membrane sorts frequencies by position: high at one
    end, low at the other.

# ---------- v1-03: from ear to percept ----------
- id: hair-cell
  term: Hair cells
  category: Hearing
  introducedIn: v1-03
  aliases: [hair cell, hair cells, inner hair cells, outer hair cells]
  def: >-
    The sensory cells along the basilar membrane. Inner hair cells turn its
    motion into nerve signals; outer hair cells amplify faint vibrations and
    sharpen the cochlea's frequency tuning. Loud sound damages them, and they
    do not grow back.

- id: place-coding
  term: Place coding (place theory)
  category: Hearing
  introducedIn: v1-03
  aliases: [place theory, place coding, place code, tonotopic, tonotopy]
  def: >-
    The idea that the ear signals frequency by *where* along the basilar
    membrane the vibration peaks: each nerve fiber reports on its own spot.

- id: temporal-coding
  term: Temporal coding (phase locking)
  category: Hearing
  introducedIn: v1-03
  aliases: [temporal theory, temporal coding, timing code, phase locking, phase-locking, phase-locked]
  def: >-
    The idea that the ear also signals frequency by *when* nerve fibers fire:
    they tend to fire at the same point in each cycle of the wave, so the
    timing of the spikes carries the period. Works well up to roughly 4–5 kHz.

- id: missing-fundamental
  term: Missing fundamental (residue pitch)
  category: Hearing
  introducedIn: v1-03
  aliases: [missing fundamental, missing-fundamental, residue pitch, virtual pitch, phantom fundamental]
  def: >-
    Hearing a harmonic tone's pitch at its fundamental even when the
    fundamental itself is absent. The remaining harmonics are still spaced
    at the fundamental's frequency and the waveform still repeats at its
    period, and the brain reports that.

- id: jnd
  term: Just-noticeable difference (JND)
  category: Hearing
  introducedIn: v1-03
  aliases: [just-noticeable difference, just noticeable difference, JND, JNDs, difference limen]
  def: >-
    The smallest change a listener can reliably detect. For the pitch of a
    mid-range tone it's a few cents; for loudness, around 1 dB.

- id: octave-equivalence
  term: Octave equivalence and pitch class
  category: Hearing
  introducedIn: v1-03
  aliases: [octave equivalence, pitch class, pitch classes, pitch-class, chroma]
  def: >-
    Notes an octave apart sound like "the same note, higher," which is why
    they share a name. All the C's form one pitch class. Pitch has two
    dimensions: height (how high) and chroma (which note name).

- id: shepard-tone
  term: Shepard tone
  category: Hearing
  introducedIn: v1-03
  aliases: [Shepard tone, Shepard tones, Shepard scale, Shepard–Risset glissando]
  def: >-
    A tone made of one note in many octaves at once, with the top and bottom
    octaves faded out. Stepping it up a scale seems to rise forever, because
    chroma keeps climbing while height never gets anywhere.

- id: decibel
  term: Decibel (dB)
  category: Hearing
  introducedIn: v1-03
  aliases: [decibel, decibels, dB, dB SPL]
  def: >-
    A logarithmic unit for comparing levels. Every 10 dB is ten times the
    power; every 20 dB is ten times the pressure. Sound pressure level (dB
    SPL) measures against the faintest audible pressure, so 0 dB SPL is
    roughly the threshold of hearing and 120 dB is painfully loud.

- id: equal-loudness
  term: Equal-loudness contours (phons)
  category: Hearing
  introducedIn: v1-03
  aliases: [equal-loudness, equal loudness, phon, phons, Fletcher–Munson, Fletcher-Munson]
  def: >-
    Curves that join pure tones of different frequencies that sound equally
    loud. The ear is most sensitive around 2–5 kHz and much less sensitive in
    the bass, especially at low levels. A tone's loudness level in phons is
    the dB level of a 1 kHz tone that sounds as loud.

- id: spectral-centroid
  term: Spectral centroid (brightness)
  category: Hearing
  introducedIn: v1-03
  aliases: [spectral centroid, spectral centroids]
  def: >-
    The balance point of a spectrum: the amplitude-weighted average frequency
    of its partials. The single best physical predictor of how bright a
    timbre sounds.

- id: attack-transient
  term: Attack transient
  category: Hearing
  introducedIn: v1-03
  aliases: [attack transient, attack transients, onset transient, onset transients]
  def: >-
    The brief, often noisy and irregular start of a note (a bow's scrape, a
    pluck's click, a breath's chiff) before it settles into a steady tone.
    It carries much of an instrument's identity.

- id: timbre-space
  term: Timbre space
  category: Hearing
  introducedIn: v1-03
  aliases: [timbre space, timbre spaces, multidimensional scaling]
  def: >-
    A map built from listeners' similarity ratings of instrument sounds, in
    which similar timbres sit close together. Its main axes usually line up
    with spectral centroid, attack time, and how the spectrum changes over a
    note.
# ---------- end v1-03 ----------

# ---------- the toolkit: notes and intervals ----------
- id: note-names
  term: Note names, sharps and flats
  category: Notes & intervals
  introducedIn: v0-02
  aliases: ['♯', '♭']
  def: >-
    Western music names pitches with the letters A to G (the white keys on a
    piano). A black key is named as a sharp (♯, one step up) of the note below
    it or a flat (♭, one step down) of the note above it, so C♯ and D♭ are the
    same key.

- id: octave
  term: Octave
  category: Notes & intervals
  introducedIn: v0-02
  deepIn: v3-01
  aliases: [octave, octaves]
  def: >-
    Two notes where one has exactly twice the frequency of the other (for
    example 220 Hz and 440 Hz). They sound so alike that they share a letter
    name. The piano's pattern of keys repeats every octave.

- id: semitone
  term: Semitone (half step)
  category: Notes & intervals
  introducedIn: v0-02
  aliases: [semitone, semitones, half step, half steps]
  def: >-
    The smallest step on a piano: from one key to the very next, white or
    black. An octave is 12 semitones.

- id: middle-c
  term: Middle C and octave numbers
  category: Notes & intervals
  introducedIn: v0-02
  aliases: [middle C, C2, C3, C4, C5, A4]
  def: >-
    Middle C is the C near the center of the piano, about 261.6 Hz.
    Octave numbers count up from each C: middle C is C4, the C an octave
    below it is C3, and so on. The orchestra's tuning A (440 Hz) is A4.

- id: interval
  term: Interval
  category: Notes & intervals
  introducedIn: v0-02
  deepIn: v3-01
  aliases: [interval, intervals, minor second, major second, minor third, major third, perfect fourth, perfect fifth, tritone, minor sixth, major sixth, minor seventh, major seventh, thirds, fourths, fifths, tenths]
  def: >-
    The distance between two pitches. Named by size in semitones: minor 2nd
    (1), major 2nd (2), minor 3rd (3), major 3rd (4), perfect 4th (5),
    tritone (6), perfect 5th (7), minor 6th (8), major 6th (9), minor 7th
    (10), major 7th (11), octave (12). Larger intervals continue the count:
    a 10th is a 3rd plus an octave.

- id: frequency-ratio
  term: Frequency ratio
  category: Notes & intervals
  introducedIn: v0-02
  deepIn: v3-01
  aliases: [ratio, ratios]
  def: >-
    An interval can be described by the ratio of its two frequencies. An
    octave is 2:1, a perfect fifth about 3:2, a perfect fourth about 4:3.
    The same interval always has the same ratio, at any pitch.

- id: cents
  term: Cents
  category: Notes & intervals
  introducedIn: v0-02
  deepIn: v3-01
  aliases: [cents, '¢']
  def: >-
    A fine-grained unit of interval size: 100 cents is one semitone and 1,200
    cents is an octave. Used for measuring small tuning differences. Most
    people start to notice a mistuning somewhere around 5–10 cents.

- id: register
  term: Register
  category: Notes & intervals
  introducedIn: v0-02
  aliases: [register, registers]
  def: >-
    How high or low a passage sits in the overall pitch range. A low register
    is the bass range.

# ---------- chords ----------
- id: chord
  term: Chord and triad
  category: Chords
  introducedIn: v0-02
  deepIn: v3-05
  aliases: [chord, chords, triad, triads]
  def: >-
    Three or more notes sounding together. A triad is three notes stacked in
    thirds: a root, a third above it, and a fifth above it (C–E–G).

- id: root
  term: Root
  category: Chords
  introducedIn: v0-02
  aliases: [root, roots]
  def: >-
    The note a chord is built on and named after: C is the root of C–E–G.

- id: major-minor
  term: Major and minor triads
  category: Chords
  introducedIn: v0-02
  deepIn: v3-05
  aliases: [major triad, minor triad, major chord, minor chord, major and minor]
  def: >-
    A major triad is a root plus a major third plus a perfect fifth (C–E–G),
    usually heard as bright and stable. A minor triad lowers the third by a
    semitone (C–E♭–G) and is usually heard as darker.

- id: voicing
  term: Voicing (close and open)
  category: Chords
  introducedIn: v1-05
  deepIn: v3-05
  aliases: [voicing, voicings]
  def: >-
    How a chord's notes are arranged: which octave each one is in and which
    is lowest. A close voicing packs the notes within an octave; an open
    voicing spreads them out.

- id: dominant-seventh
  term: Dominant seventh chord
  category: Chords
  introducedIn: v1-05
  deepIn: v3-06
  aliases: [dominant seventh, dominant 7th, V7]
  def: >-
    A major triad with a minor seventh added above the root (G–B–D–F). In
    classical and much popular music it strongly "wants" to move to the chord
    a fifth below it (G7 → C).

- id: extensions
  term: Chord extensions (9ths, 11ths, 13ths)
  category: Chords
  introducedIn: v1-05
  deepIn: v3-07
  aliases: [ninths, elevenths, thirteenths]
  def: >-
    Notes stacked above a chord's seventh, continuing in thirds. The 9th is
    the 2nd an octave up, the 13th the 6th an octave up. Common in jazz as
    added color.

- id: power-chord
  term: Power chord
  category: Chords
  introducedIn: v1-05
  deepIn: v4-06
  aliases: [power chord, power chords]
  def: >-
    A root and a fifth, often with the octave added, and no third. The staple
    of distorted rock guitar.

- id: cluster
  term: Tone cluster
  category: Chords
  introducedIn: v1-05
  aliases: [cluster, clusters]
  def: >-
    A chord made of adjacent notes, such as C–C♯–D, all sounding together.

# ---------- harmony & style ----------
- id: resolution
  term: Resolution
  category: Harmony & style
  introducedIn: v1-05
  deepIn: v3-06
  aliases: [resolve, resolves, resolved, resolution, unresolved]
  def: >-
    Moving from a tense or unstable sound to a stable one, as when G7 moves to
    C. The ear hears it as release or arrival.

- id: common-practice
  term: Common practice
  category: Harmony & style
  introducedIn: v1-05
  deepIn: v3-06
  aliases: [common practice, common-practice]
  def: >-
    The shared harmonic conventions of European art music from roughly 1650
    to 1900 (Bach to Brahms). Still the basis of most textbook music theory.

- id: counterpoint
  term: Counterpoint
  category: Harmony & style
  introducedIn: v1-05
  deepIn: v3-08
  aliases: [counterpoint]
  def: >-
    Music made of two or more independent melodies sounding at once, and the
    rules for combining them.

# ---------- tuning ----------
- id: equal-temperament
  term: Equal temperament (12-TET)
  category: Tuning
  introducedIn: v0-02
  deepIn: v3-02
  aliases: [equal temperament, equal-tempered, 12-TET, 12-tone equal]
  def: >-
    The modern standard tuning: the octave is divided into 12 exactly equal
    semitones. Every key works equally well, at the cost of most intervals
    being slightly off their pure ratios.

- id: just-intonation
  term: Just intonation
  category: Tuning
  introducedIn: v1-05
  deepIn: v3-02
  aliases: [just intonation, just third]
  def: >-
    Tuning intervals to exact small-number ratios (3:2 fifths, 5:4 thirds) so
    their harmonics line up. Very pure, but on a fixed-pitch instrument it
    can't work in every key at once.

- id: pythagorean-tuning
  term: Pythagorean tuning
  category: Tuning
  introducedIn: v1-05
  deepIn: v3-02
  aliases: [Pythagorean tuning, Pythagorean third]
  def: >-
    A tuning built entirely from stacked pure 3:2 fifths. Its fifths and
    fourths are pure and its thirds are wide and rough. It was the basis of
    medieval European music theory.

# ---------- v3-02: scales and tuning systems ----------
- id: comma
  term: Comma (Pythagorean, syntonic)
  category: Tuning
  introducedIn: v1-05
  deepIn: v3-02
  aliases: [Pythagorean comma, syntonic comma, syntonic commas]
  def: >-
    A tiny interval left over when two routes to the "same" note disagree.
    Twelve pure fifths overshoot seven octaves by the Pythagorean comma
    (about 23.5 cents); four pure fifths overshoot a pure major third plus two
    octaves by the syntonic comma (81:80, about 21.5 cents). Every fixed tuning
    has to hide these somewhere.

- id: temperament
  term: Temperament
  category: Tuning
  introducedIn: v3-02
  aliases: [temperaments, tempering, tempered intervals]
  def: >-
    Deliberately mistuning some intervals slightly away from pure so that a
    fixed set of pitches works in more keys. Equal temperament, meantone, and
    well temperament are different answers to where the commas should go.

- id: meantone
  term: Meantone
  category: Tuning
  introducedIn: v1-05
  deepIn: v3-02
  aliases: [meantone, quarter-comma meantone, meantone temperament]
  def: >-
    A family of tunings that narrow every fifth slightly so the major thirds
    come out pure or nearly pure. Standard on European keyboards from the
    sixteenth century into the eighteenth. Beautiful in keys near C; one fifth
    (the wolf) is unusable.

- id: wolf-interval
  term: Wolf interval
  category: Tuning
  introducedIn: v3-02
  aliases: [wolf fifth, wolf fifths, wolf interval]
  def: >-
    The one badly out-of-tune interval left over when a keyboard tuning makes
    all the others pure or nearly pure: the place the comma was hidden. In
    meantone it's the fifth G♯–E♭, about 36 cents too wide; it howls.

- id: well-temperament
  term: Well temperament
  category: Tuning
  introducedIn: v3-02
  aliases: [well temperament, well temperaments, well-temperament]
  def: >-
    A keyboard tuning with no wolf, in which every key is usable but keys are
    not all the same: keys near C have purer thirds than distant ones, giving
    each key its own color. Werckmeister and others published such tunings
    around 1700.

- id: edo
  term: Equal divisions of the octave (N-TET)
  category: Tuning
  introducedIn: v3-02
  aliases: [N-TET, EDO, EDOs, 19-TET, 22-TET, 24-TET, 31-TET, 41-TET, 53-TET, equal divisions of the octave]
  def: >-
    Splitting the octave into some number N of identical steps. Twelve is the
    standard; 19 and 31 give better thirds, 53 is almost pure everywhere, and
    24 (quarter tones) is used in modern Arabic theory.

- id: microtone
  term: Microtone
  category: Tuning
  introducedIn: v3-02
  deepIn: v3-10
  aliases: [microtone, microtones, microtonal, microtonality, quarter tone, quarter tones, quarter-tone, quarter-tones]
  def: >-
    Any interval smaller than a semitone, or more loosely, any pitch that falls
    between the keys of a piano. A quarter tone is half a semitone (50 cents).
    Many traditions use them as ordinary scale steps.

- id: slendro-pelog
  term: Slendro and pelog
  category: Tuning
  introducedIn: v1-05
  deepIn: v3-02
  aliases: [slendro, pelog]
  def: >-
    The two tuning systems of Javanese and Balinese gamelan. Slendro divides
    the octave into five nearly equal steps (roughly 240 cents each); pelog
    has seven unequal steps. The exact tuning varies from one gamelan to
    another, and each set of instruments is tuned as a unit.

# ---------- consonance (introduced in 1.5) ----------
- id: beats
  term: Beats (acoustic beating)
  category: Consonance
  introducedIn: v1-05
  # Not plain "beats": that collides with the rhythmic beat.
  aliases: [beating, beat rate, beats per second]
  def: >-
    A regular pulsing in loudness when two close frequencies sound together.
    The number of pulses per second equals the difference between the two
    frequencies.

- id: roughness
  term: Roughness
  category: Consonance
  introducedIn: v1-05
  aliases: [roughness]
  def: >-
    The buzzy, grainy sensation produced when two frequencies are close
    together but too far apart to be heard as slow beats. The core of sensory
    dissonance.

- id: critical-band
  term: Critical band
  category: Consonance
  introducedIn: v1-03 # v1-03 moved this earlier; v1-05 treats it in depth
  deepIn: v1-05
  aliases: [critical band, critical bands, critical bandwidth, ERB]
  def: >-
    The range of frequencies that excite the same region of the inner ear.
    Tones within one critical band interact (beats, roughness); tones further
    apart are heard as separate.

- id: consonance
  term: Consonance and dissonance
  category: Consonance
  introducedIn: v1-05
  aliases: [consonance, consonant, dissonance, dissonant, dissonances]
  def: >-
    Loosely, how smooth and stable (consonant) or tense and clashing
    (dissonant) a combination of notes sounds. Chapter 1.5 shows that this is
    really several different things.

# ---------- rhythm: toolkit ----------
- id: beat
  term: Beat
  category: Rhythm
  introducedIn: v0-02
  deepIn: v2-02
  aliases: [beat, on the beat, offbeat, offbeats]
  def: >-
    The steady pulse you tap your foot to. Beats are counted ("1, 2, 3, 4") and
    are the main reference points of musical time.

- id: tempo
  term: Tempo (BPM)
  category: Rhythm
  introducedIn: v0-02
  deepIn: v2-01
  aliases: [tempo, tempos, tempi, BPM]
  def: >-
    How fast the beat goes, measured in beats per minute (BPM). 60 BPM is one
    beat per second; most dance music sits around 100–130 BPM.

- id: meter
  term: Meter, bars, and 4/4
  category: Rhythm
  introducedIn: v0-02
  deepIn: v2-01
  aliases: [meter, time signature, '4/4', downbeat, downbeats]
  def: >-
    Beats are grouped into repeating units called bars (or measures). In 4/4,
    the most common meter in popular music, each bar has four beats, and the
    first beat of each bar (the downbeat) is the strongest.

- id: subdivision
  term: Subdivision (eighths, sixteenths, triplets)
  category: Rhythm
  introducedIn: v0-02
  deepIn: v2-03
  aliases: [subdivision, subdivisions, eighth notes, sixteenth notes, eighth-note, sixteenth-note, eighths, sixteenths, triplet, triplets]
  def: >-
    Splitting each beat into smaller, equal parts: two eighth notes per beat
    (counted "1 &"), four sixteenth notes ("1 e & a"), or three triplets.

# ---------- rhythm: Vol II ----------
# v2-02: beat induction
- id: beat-induction
  term: Beat induction
  category: Rhythm
  introducedIn: v2-02
  aliases: [beat induction, induce a beat, induces a beat, beat finding]
  def: >-
    The listener's (or brain's) act of finding a steady beat in a rhythm,
    including beats that fall on silence. The beat is inferred, not played.

- id: tactus
  term: Tactus
  category: Rhythm
  introducedIn: v2-02
  aliases: [tactus]
  def: >-
    The level of the metrical hierarchy that listeners feel as "the beat" and
    tap to, usually the one closest to about 600 ms between beats.

- id: metrical-hierarchy
  term: Metrical hierarchy (metrical grid)
  category: Rhythm
  introducedIn: v2-02
  aliases: [metrical hierarchy, metrical grid, metrical level, metrical levels, metrical weight, metrical weights]
  def: >-
    Meter as a stack of steady pulses at different speeds (sixteenths,
    eighths, beats, half bars, bars), each fitting inside the next. A
    position is strong when many levels have a beat there.

- id: subjective-rhythmization
  term: Subjective rhythmization
  category: Rhythm
  introducedIn: v2-02
  aliases: [subjective rhythmization, tick-tock effect]
  def: >-
    Hearing identical, evenly spaced clicks as grouped (in twos, threes, or
    fours, with an accent at the start of each group) although nothing in
    the sound changes.

- id: hemiola
  term: Hemiola
  category: Rhythm
  introducedIn: v2-02
  deepIn: v2-04
  aliases: [hemiola, hemiolas]
  def: >-
    Regrouping six equal pulses from two groups of three into three groups
    of two (or the reverse), as in alternating bars of 6/8 and 3/4.

- id: clave
  term: Clave and tresillo
  category: Rhythm
  introducedIn: v2-02
  deepIn: v2-06
  aliases: [clave, son clave, rumba clave, tresillo]
  def: >-
    The tresillo is a 3 + 3 + 2 grouping of eight pulses, heard across Latin
    American and African-American music. The son clave adds a second half:
    five strokes over a 16-pulse cycle (3 + 3 + 4 + 2 + 4), the timeline that
    organizes Cuban son and salsa.

- id: backbeat
  term: Backbeat
  category: Rhythm
  introducedIn: v2-03
  aliases: [backbeat, backbeats]
  def: >-
    Accents on beats 2 and 4 of a 4/4 bar, usually played on the snare drum
    (or clapped). The metrically weaker beats get the loudest hit, while the
    kick and bass hold 1 and 3. The defining rhythmic feature of rock, R&B,
    and most pop since the 1950s, with roots in gospel and jump blues.

- id: syncopation
  term: Syncopation
  category: Rhythm
  introducedIn: v2-02 # v2-02: was v2-03; felt against the meter
  deepIn: v2-03
  aliases: [syncopation, syncopated, syncopations]
  def: >-
    Accenting or placing notes where the meter says it's weak, and leaving the
    strong positions empty, so the rhythm pulls against the beat. A note
    just before the downbeat, followed by silence on the downbeat, is the
    classic example.

- id: drum-kit
  term: Drum kit (kick, snare, hi-hat, ride)
  category: Rhythm
  introducedIn: v2-03 # v2-03: was v2-05; the backbeat needs the snare
  deepIn: v4-01
  aliases: [kick drum, snare, hi-hat, ride cymbal]
  def: >-
    The standard pop and jazz drum set. The kick (bass drum) is the low thump,
    played with a foot pedal. The snare is the sharp crack, usually on the
    backbeat. The hi-hat is a pair of small cymbals that keeps steady time
    (closed: a tight "tss"). The ride is a large cymbal for longer, ringing
    time-keeping patterns, central in jazz.

- id: sequencer
  term: Drum machine and step sequencer
  category: Rhythm
  introducedIn: v2-05
  deepIn: v4-06
  aliases: [drum machine, drum machines, sequencer, sequencers, step sequencer]
  def: >-
    A device or program that plays a stored pattern on a grid of steps
    (typically 16 per bar), with machine-exact timing unless told otherwise.

- id: groove
  term: Groove
  category: Rhythm
  introducedIn: v2-05
  aliases: [groove, grooves, groovy]
  def: >-
    In music psychology, the pleasurable urge to move to music. More loosely,
    the rhythmic feel of a performance.

- id: swing
  term: Swing and shuffle
  category: Rhythm
  introducedIn: v2-03 # v2-03: was v2-05; the shuffle as a triplet feel
  deepIn: v2-05
  aliases: [swing, swung, swing ratio, shuffle]
  def: >-
    Playing pairs of notes long-short instead of evenly. The degree of swing
    is often given as a ratio (2:1 = triplet swing) or a percentage of the
    pair taken by the first note (50% = straight, 67% = triplet). A shuffle
    is a strongly swung groove.

- id: microtiming
  term: Microtiming
  category: Rhythm
  introducedIn: v2-05
  aliases: [microtiming, microrhythm, microrhythms, laid back, laid-back]
  def: >-
    Small, systematic timing deviations from the metronomic grid, typically
    10–50 milliseconds, such as a snare consistently played slightly late
    ("laid back") or a hi-hat slightly early ("pushing").

- id: quantize
  term: Quantization
  category: Rhythm
  introducedIn: v2-05
  aliases: [quantize, quantized, quantizing, quantization]
  def: >-
    Snapping recorded notes to the nearest grid position, removing timing
    deviations. Standard in drum machines and digital audio workstations.

- id: ghost-note
  term: Ghost note
  category: Rhythm
  introducedIn: v2-05
  aliases: [ghost note, ghost notes]
  def: >-
    A very soft note, usually on the snare, played between the main accents.
    Felt more than heard, it fills in the subdivision.

- id: entrainment
  term: Entrainment
  category: Rhythm
  introducedIn: v2-02 # v2-02: was v2-05
  deepIn: v2-07
  aliases: [entrainment, entrain, entrains]
  def: >-
    The tendency of a rhythmic system (a body, a brain, or two players) to
    lock its timing to an external rhythm, as when you start tapping along
    without meaning to.

- id: predictive-processing
  term: Predictive processing
  category: Hearing
  introducedIn: v1-06
  aliases: [predictive processing, predictive coding, prediction error, prediction errors]
  def: >-
    The theory that the brain constantly predicts incoming sensations and
    learns from the mismatch (prediction error). In music, a leading
    explanation for why expectations, and their violations, feel the way
    they do. How strongly an error counts depends on how confident the
    prediction was.

# ---------- v1-06: attention, memory, expectation, emotion ----------
- id: statistical-learning
  term: Statistical learning
  category: Hearing
  introducedIn: v1-06
  aliases: [statistical learning, transitional probability, transitional probabilities]
  def: >-
    Picking up, without trying, how often things happen and what tends to
    follow what (transitional probabilities), just from exposure. How
    listeners absorb the patterns of a musical style, and how infants find
    word boundaries in speech.

- id: expectation-types
  term: Schematic, veridical, and dynamic expectations
  category: Hearing
  introducedIn: v1-06
  aliases: [schematic expectation, schematic expectations, veridical expectation, veridical expectations, veridical memory, dynamic expectation, dynamic expectations]
  def: >-
    Huron's three sources of musical prediction. Schematic expectations come
    from a style in general (what usually happens in tonal melodies);
    veridical ones from memory of this particular piece; dynamic ones from
    what has happened so far in this hearing. They can disagree, which is
    why a known surprise can still surprise.

- id: itpra
  term: ITPRA
  category: Hearing
  introducedIn: v1-06
  deepIn: v5-04
  aliases: [ITPRA]
  def: >-
    David Huron's five-part model of responses around an expected event:
    Imagination and Tension before it; Prediction (a reward for guessing
    right), Reaction (fast, automatic), and Appraisal (slower, conscious)
    after it.

- id: surprisal
  term: Surprisal (information content)
  category: Hearing
  introducedIn: v1-06
  aliases: [surprisal, information content]
  def: >-
    How unexpected an event is, measured as minus the base-2 logarithm of
    its probability, in bits: a 50% event carries 1 bit, a 25% event 2 bits,
    a 1-in-8 event 3 bits. Used by computer models of melodic expectation
    such as IDyOM.

- id: echoic-memory
  term: Echoic memory
  category: Hearing
  introducedIn: v1-06
  aliases: [echoic memory, auditory sensory memory]
  def: >-
    A brief, detailed trace of what you just heard, lasting up to a few
    seconds, before most of it is lost or recoded into short-term memory.

- id: short-term-memory
  term: Short-term memory
  category: Hearing
  introducedIn: v1-06
  aliases: [short-term memory, working memory]
  def: >-
    The small amount you can hold in mind at once, for a few seconds
    without rehearsal. In music it sets the span of the "present": roughly a
    phrase. Grouping notes into larger units (chunking) stretches it.

- id: chunking
  term: Chunking
  category: Hearing
  introducedIn: v1-06
  aliases: [chunking]
  def: >-
    Grouping several items into one familiar unit (a motif, a riff, a chord
    pattern), so that memory holds one chunk rather than many separate notes.

- id: mere-exposure
  term: Mere-exposure effect
  category: Hearing
  introducedIn: v1-06
  aliases: [mere exposure, mere-exposure, exposure effect]
  def: >-
    The tendency to like things more simply because they are familiar. In
    music, liking often rises with repeated listening, then levels off or
    falls once a piece becomes too predictable.

- id: emotion-mechanisms
  term: Mechanisms of musical emotion (BRECVEMA)
  category: Hearing
  introducedIn: v1-06
  aliases: [BRECVEMA, emotional contagion, evaluative conditioning, brain stem reflex]
  def: >-
    Juslin's list of routes by which music can induce emotion, among them
    brain stem reflexes, rhythmic entrainment, evaluative conditioning,
    emotional contagion, visual imagery, episodic memory, musical
    expectancy, and aesthetic judgment. Different routes can act at once.

# ---------- sound: Vol I ch. 1-2 ----------
- id: waveform
  term: Waveform
  category: Sound
  introducedIn: v1-01
  aliases: [waveform, waveforms]
  def: >-
    A graph of a sound's pressure (or a string's displacement) over time. A
    sine wave is the smoothest possible waveform; most real sounds have more
    complicated, repeating shapes.

- id: phase
  term: Phase
  category: Sound
  introducedIn: v1-01
  aliases: [phase, phases, out of phase, in phase]
  def: >-
    Where a wave is in its cycle at a given moment. Two waves of the same
    frequency can be in phase (peaks together, reinforcing) or out of phase
    (peaks against troughs, cancelling).

# v1-01: vibrations and waves
- id: sound-wave
  term: Sound wave (pressure wave)
  category: Sound
  introducedIn: v1-01
  aliases: [sound wave, sound waves, pressure wave, pressure waves, sound pressure, rarefaction, rarefactions]
  def: >-
    Sound travelling through air: a pattern of slightly squeezed regions
    (compressions) and slightly stretched regions (rarefactions) that moves
    outward from a vibrating object. The air itself only jiggles back and
    forth in place; the pattern is what travels.

- id: simple-harmonic-motion
  term: Simple harmonic motion
  category: Sound
  introducedIn: v1-01
  aliases: [simple harmonic motion]
  def: >-
    The back-and-forth motion of anything with mass and springiness (a weight
    on a spring, a pendulum, a tuning fork's prong) when it is disturbed and
    let go. Plotted over time, it traces a sine wave.

- id: amplitude
  term: Amplitude
  category: Sound
  introducedIn: v1-01
  deepIn: v1-03
  aliases: [amplitude, amplitudes]
  def: >-
    The size of a vibration: how far a string swings, or how much the air
    pressure rises and falls. Bigger amplitude generally sounds louder, but
    loudness is a perception and depends on frequency too (chapter 1.3).

- id: period
  term: Period
  category: Sound
  introducedIn: v1-01
  aliases: [its period, one period, the period of, period of the wave, period of a wave]
  def: >-
    The time one cycle of a vibration takes. It is one divided by the
    frequency: a 100 Hz tone has a period of 10 milliseconds.

- id: wavelength
  term: Wavelength
  category: Sound
  introducedIn: v1-01
  aliases: [wavelength, wavelengths]
  def: >-
    The distance in space between one compression of a sound wave and the
    next: the speed of sound divided by the frequency. About 1.3 m for
    middle C, about 17 m at the bottom of hearing, about 2 cm at the top.

- id: speed-of-sound
  term: Speed of sound
  category: Sound
  introducedIn: v1-01
  aliases: [speed of sound]
  def: >-
    How fast a sound wave travels: about 343 meters per second in room-
    temperature air (roughly a kilometer every three seconds), faster in
    warm air, much faster in water and solids. All frequencies travel at the
    same speed.

- id: interference
  term: Interference (superposition)
  category: Sound
  introducedIn: v1-01
  aliases: [interference, superposition, constructive interference, destructive interference, phase cancellation, cancel each other]
  def: >-
    When waves overlap, their pressures simply add (superposition). Peaks
    meeting peaks reinforce (constructive interference); peaks meeting troughs
    cancel (destructive interference). Noise-cancelling headphones work this
    way.

- id: polarity
  term: Polarity
  category: Sound
  introducedIn: v1-01
  deepIn: v4-08
  aliases: [polarity]
  def: >-
    Which way a signal pushes: flipping polarity turns every peak into a
    trough. Played alone, a flipped signal sounds the same; mixed with the
    unflipped original, the two cancel.

- id: room-modes
  term: Room modes
  category: Sound
  introducedIn: v1-01
  deepIn: v4-07
  aliases: [room mode, room modes]
  def: >-
    Frequencies whose wavelengths fit a room's dimensions, so reflections
    pile up into standing waves. They make some bass notes boom and others
    vanish depending on where you sit.
# end v1-01

- id: standing-wave
  term: Standing wave and modes
  category: Sound
  introducedIn: v1-02
  deepIn: v4-01
  aliases: [standing wave, standing waves, mode of vibration, modes of vibration]
  def: >-
    A vibration pattern that stays in place, like a string fixed at both
    ends swinging in one, two, three… sections. Each pattern is a mode, with
    still points (nodes) between the moving sections. A string's modes
    vibrate at whole-number multiples of its lowest frequency.

- id: spectrum
  term: Spectrum
  category: Sound
  introducedIn: v1-02
  aliases: [spectrum, spectra, spectral]
  def: >-
    The recipe of a sound: which frequencies it contains and how strong each
    one is. Usually drawn with frequency left to right and strength as
    height.

- id: fourier
  term: Fourier's theorem
  category: Sound
  introducedIn: v1-02
  aliases: [Fourier]
  def: >-
    Any repeating waveform, however complicated, can be built by adding
    together sine waves at whole-number multiples of its repetition rate,
    which are its harmonics.

- id: resonance
  term: Resonance
  category: Sound
  introducedIn: v1-02
  deepIn: v4-01
  aliases: [resonance, resonances, resonant, resonate, resonates, resonator, resonators]
  def: >-
    The tendency of an object or air space to vibrate strongly at particular
    natural frequencies, like a wine glass ringing or a swing pushed at the
    right rhythm. Instrument bodies and the vocal tract are resonators that
    boost some frequency regions more than others.

- id: formant
  term: Formant
  category: Sound
  introducedIn: v1-02
  deepIn: v4-02
  aliases: [formant, formants]
  def: >-
    A frequency region boosted by a resonance of the vocal tract (or an
    instrument body), regardless of the note being sung or played. Vowels
    are distinguished mainly by their formants.

- id: inharmonicity
  term: Inharmonic sounds
  category: Sound
  introducedIn: v1-02
  deepIn: v4-01
  aliases: [inharmonic, inharmonicity]
  def: >-
    Sounds whose partials are not whole-number multiples of a fundamental,
    such as bells, gongs, many drums, and (slightly) stiff piano strings. Their
    pitch can be ambiguous or absent.

# ---------- keys, cadences, form & tension (Vol V ch. 4) ----------
- id: scale
  term: Scale
  category: Notes & intervals
  introducedIn: v3-02 # v3-02: was v3-03 (3.3 now deepens it)
  deepIn: v3-03
  aliases: [major scale, minor scale, scale degree, scale degrees]
  def: >-
    A fixed set of notes, listed in pitch order, that a piece mostly draws
    from. The C major scale is the seven white keys from C: C D E F G A B.

- id: key
  term: Key and tonic
  category: Harmony & style
  introducedIn: v3-03
  deepIn: v3-04
  aliases: [home key, in the key of, home chord]
  def: >-
    A piece "in C major" mostly uses the notes of the C major scale and treats
    C as home: the tonic. The tonic chord (C–E–G) is where phrases sound
    finished. Music can move away from the tonic and back.

# v3-04: tonic split out of `key` so later chapters can assume it by id.
- id: tonic
  term: Tonic (tonal center)
  category: Harmony & style
  introducedIn: v3-03
  deepIn: v3-04
  aliases: [tonic, tonal center, tonal centers, tonal centre, tonality, home note]
  def: >-
    The note that sounds like home in a passage: where melodies come to rest
    and phrases sound finished. In C major the tonic is C. Which note is home
    is something listeners infer from context, not a property of the notes alone.

- id: dominant
  term: Dominant
  category: Harmony & style
  introducedIn: v3-06 # v3-06: was v5-04
  aliases: [dominant chord, the dominant]
  def: >-
    The chord built on the fifth note of the scale (G–B–D in C major), often
    with an added seventh (G7). It pulls strongly toward the tonic, partly
    because its B sits a semitone below C (the leading tone).

- id: cadence
  term: Cadence
  category: Harmony & style
  introducedIn: v3-06 # v3-06: was v5-04
  aliases: [cadence, cadences, authentic cadence, half cadence, deceptive cadence, plagal cadence]
  def: >-
    A conventional chord move that ends a phrase, like punctuation. Dominant to
    tonic (G7→C) is a full stop; stopping on the dominant is a comma (half
    cadence); dominant to the minor chord on A (deceptive cadence) is a
    sidestep.

- id: suspension
  term: Suspension
  category: Harmony & style
  introducedIn: v5-04
  deepIn: v3-08
  aliases: [suspension, suspensions, sus4, suspended chord, suspended fourth]
  def: >-
    A note held over from one chord into the next, where it doesn't belong,
    before stepping down to a chord tone. Gsus4 (G–C–D) resolving to G (G–B–D)
    is the classic case: a small delay that adds tension.

- id: modulation
  term: Modulation (key change)
  category: Harmony & style
  introducedIn: v3-06 # v3-06: was v5-04
  deepIn: v5-05
  aliases: [key change, key changes, modulates to, modulated to, modulation to, modulating to, pivot chord]
  def: >-
    Moving to a new tonic: the music re-centers on a different home note.
    In pop, a final chorus shifted up a half or whole step is a common way to
    lift a song's ending.

- id: pedal-point
  term: Pedal point
  category: Harmony & style
  introducedIn: v3-04 # v3-04: moved earlier (was v5-04)
  deepIn: v5-04
  aliases: [pedal point, pedal note, dominant pedal]
  def: >-
    A note held or repeated (usually in the bass) while the harmony changes
    above it. Sustained on the dominant, it builds expectation for the tonic.

- id: dynamics
  term: Dynamics
  category: Form & tension
  introducedIn: v5-04
  aliases: [dynamics, crescendo, crescendos, diminuendo, decrescendo]
  def: >-
    How loud or soft music is played, and how that changes. A crescendo is a
    gradual increase in loudness; a diminuendo, a gradual decrease.

- id: texture
  term: Texture
  category: Form & tension
  introducedIn: v3-08 # v3-08: was v5-04; the four textures are taught there
  deepIn: v5-07
  aliases: [musical texture, thin texture, thick texture, textural]
  def: >-
    How many layers are sounding at once and how they relate: a voice alone
    is a thin texture; a full band or orchestra, a thick one.

- id: tension
  term: Musical tension
  category: Form & tension
  introducedIn: v5-04
  aliases: [musical tension, tension and release, harmonic tension, tension curve, tension curves, tension ratings]
  def: >-
    The felt sense that music is unstable and going somewhere, and its
    release when it arrives. Carried by harmony, loudness, pitch height,
    density, and rhythm, and largely a matter of expectation.

- id: song-sections
  term: Song sections
  category: Form & tension
  introducedIn: v5-02 # v5-02: moved earlier (was v5-04); the repetition table needs verse and chorus
  deepIn: v5-05
  aliases: [verse, verses, chorus, choruses, pre-chorus, bridge section]
  def: >-
    The building blocks of a pop song. Verses tell the story with changing
    words; the chorus repeats the hook; a pre-chorus ramps up into it; a
    bridge brings contrast before the final choruses.

- id: build-drop
  term: Build and drop
  category: Form & tension
  introducedIn: v5-04
  aliases: [build-up, buildup, the drop, a drop, riser, risers, breakdown]
  def: >-
    The central gesture of electronic dance music. A build stacks up tension
    (snare rolls, rising sounds, the bass removed); the drop releases it with
    the full beat and bass line.

- id: habituation
  term: Habituation
  category: Hearing
  introducedIn: v1-06 # v1-06: was v5-04
  deepIn: v5-04
  aliases: [habituation, habituate, habituates, habituated]
  def: >-
    The fading of a response to a stimulus that keeps repeating unchanged.
    One reason music needs contrast.

- id: frisson
  term: Frisson (musical chills)
  category: Hearing
  introducedIn: v1-06 # v1-06: was v5-04
  deepIn: v5-04
  aliases: [frisson, musical chills, chills]
  def: >-
    Goosebumps or a shiver down the spine at a peak moment in music. Often
    triggered by a sudden change after a build: a new harmony, an entrance, a
    leap in loudness.

# ---------- form (v5-05) ----------
- id: musical-form
  term: Form
  category: Form & tension
  introducedIn: v5-05
  aliases: [musical form, letter scheme, formal sections, formal plan, formal boundary, formal boundaries]
  def: >-
    The large-scale plan of a piece: which sections it has, in what order, and
    which ones return. Usually written with letters (A B A), where the same
    letter means the same music coming back and a prime (A′) means a varied return.

- id: ternary-form
  term: Binary and ternary form
  category: Form & tension
  introducedIn: v5-05
  aliases: [ternary form, binary form, ABA form, da capo, minuet and trio]
  def: >-
    Two basic plans. Binary form is two sections, A B, often each repeated.
    Ternary form is A B A: a statement, a contrast, and a return.

- id: strophic
  term: Strophic form and refrain
  category: Form & tension
  introducedIn: v5-05
  aliases: [strophic, strophe, strophes, refrain, refrains]
  def: >-
    Strophic form repeats the same music for every verse (strophe) of the
    words: A A A. A refrain is a line or two of fixed words and music that ends
    each verse. A chorus is a refrain that has grown into a section of its own.

- id: aaba-form
  term: 32-bar song form (AABA)
  category: Form & tension
  introducedIn: v5-05
  aliases: [AABA, 32-bar song form, 32-bar form, thirty-two-bar, middle eight]
  def: >-
    The standard plan of Tin Pan Alley and Broadway songs and many jazz
    standards: four 8-bar sections, A A B A. The B section is called the
    bridge (or release, or middle eight).

- id: twelve-bar-blues
  term: 12-bar blues
  category: Form & tension
  introducedIn: v5-05
  aliases: [12-bar blues, twelve-bar blues, 12-bar, twelve-bar, blues progression]
  def: >-
    A 12-bar chord cycle, in its basic version I I I I, IV IV I I, V IV I I,
    repeated as the unit of the whole piece. Each time through is called a
    chorus. Blues lyrics often follow an AAB pattern: a line, the line again,
    and an answering line.

- id: rondo
  term: Rondo
  category: Form & tension
  introducedIn: v5-05
  aliases: [rondo, rondos, rondo form]
  def: >-
    A form in which a main section keeps returning between contrasting
    episodes: A B A C A (or longer). Common in the last movements of classical
    sonatas, concertos, and symphonies.

- id: sonata-form
  term: Sonata form
  category: Form & tension
  introducedIn: v5-05
  aliases: [sonata form, sonata-form, exposition, expositions, recapitulation, recapitulations, retransition, first theme, second theme]
  def: >-
    The main plan for first movements in the classical era. The exposition
    presents a first theme in the home key and a second theme in a new key; the
    development moves through many keys and works the themes over; the
    recapitulation brings both themes back in the home key. Often a coda follows.

- id: relative-key
  term: Relative major and minor
  category: Harmony & style
  introducedIn: v3-04 # v3-04: moved earlier (was v5-05)
  deepIn: v5-05
  aliases: [relative major, relative minor, relative key]
  def: >-
    A major key and a minor key that use the same notes, with different tonics.
    C minor's relative major is E♭ major; A minor's is C major.

- id: through-composed
  term: Through-composed
  category: Form & tension
  introducedIn: v5-05
  aliases: [through-composed, through composed, durchkomponiert]
  def: >-
    Music that keeps moving to new material instead of bringing whole sections
    back: A B C D... Unity comes from smaller things (motifs, a key plan, a
    story) rather than from returning sections.

- id: coda
  term: Coda
  category: Form & tension
  introducedIn: v5-05
  aliases: [coda, codas]
  def: >-
    Italian for "tail": a closing section added after the main form is complete,
    confirming the ending. The classical equivalent of an outro.

# ---------- auditory scene analysis (v1-04) ----------
- id: auditory-scene-analysis
  term: Auditory scene analysis
  category: Hearing
  introducedIn: v1-04
  aliases: [auditory scene analysis, auditory scene, scene analysis]
  def: >-
    The brain's job of sorting the single mixed pressure wave that reaches each
    ear into separate sources: this voice, that guitar, the traffic outside.
    Term and theory from Albert Bregman (1990).

- id: auditory-stream
  term: Auditory stream
  category: Hearing
  introducedIn: v1-04
  aliases: [auditory stream, auditory streams, stream segregation, one stream, two streams, streamed, segregate, segregates]
  def: >-
    A sequence of sounds heard as coming from one source and belonging
    together over time, like one melody or one voice. Sounds that are close in
    pitch, similar in timbre, and not too fast tend to form one stream; otherwise
    they split (segregate) into several.

- id: grouping
  term: Grouping cues (Gestalt principles)
  category: Hearing
  introducedIn: v1-04
  aliases: [Gestalt, grouping cue, grouping cues, common fate, good continuation, onset synchrony, old-plus-new]
  def: >-
    The rules of thumb the auditory system uses to decide what belongs
    together: proximity (close in pitch and time), similarity (same timbre),
    common fate (changing together), good continuation (smooth paths), and
    shared onsets. Named after the Gestalt psychologists, who described the same
    rules for vision.

- id: fusion
  term: Fusion
  category: Hearing
  introducedIn: v1-04
  aliases: [perceptual fusion, harmonic fusion, fusion]
  def: >-
    Hearing several simultaneous frequencies as one sound with one pitch and
    one timbre, rather than as separate tones. Harmonics of one fundamental that
    start together and change together fuse; a mistuned or early-starting
    harmonic can pop out.

- id: masking
  term: Masking
  category: Hearing
  introducedIn: v1-04
  aliases: [masking, masker, masked]
  def: >-
    One sound making another harder or impossible to hear. Strongest when the
    two are close in frequency (within a critical band), and a loud low sound
    masks higher sounds more than the reverse. Mixing engineers fight it
    constantly.

- id: implied-polyphony
  term: Implied polyphony
  category: Hearing
  introducedIn: v1-04
  aliases: [implied polyphony, pseudo-polyphony, compound melody]
  def: >-
    A single line of notes that leaps back and forth between registers fast
    enough to be heard as two or more simultaneous melodies. Bach's solo string
    music is the classic example.

# ---------- melody (v3-03) ----------
- id: contour
  term: Contour
  category: Melody
  introducedIn: v3-03
  aliases: [contour, contours, melodic contour, Parsons code]
  def: >-
    The shape of a melody: the pattern of ups, downs, and repeats from note to
    note, ignoring exactly how big each step is. Listeners remember the contour
    of a new melody more readily than its exact intervals.

- id: step-leap
  term: Steps and leaps
  category: Melody
  introducedIn: v3-03
  aliases: [stepwise, conjunct, disjunct, leaps, melodic leap, gap-fill, gap fill, post-skip reversal]
  def: >-
    A step is a move to an adjacent scale note (one or two semitones); a leap
    (or skip) is anything bigger. Most melodies move mostly by step, and after a
    big leap they tend to turn back.

- id: melodic-expectation
  term: Melodic expectation
  category: Melody
  introducedIn: v3-03
  aliases: [pitch proximity, regression to the mean, implication-realization, Narmour]
  def: >-
    Listeners' moment-to-moment predictions of the next note, shaped by
    statistical regularities: small intervals are likely, leaps tend to be
    followed by a turn back, phrases tend to descend at the end and land on the
    tonic.

- id: motif
  term: Motif
  category: Melody
  introducedIn: v3-03
  aliases: [motif, motifs, motive, motives, motivic]
  def: >-
    A short, recognizable musical idea (a few notes with a characteristic
    rhythm) that is repeated and varied to build longer music. Beethoven's
    Fifth opens with the most famous one. In rock and pop a repeated
    instrumental motif is called a riff.

- id: phrase
  term: Phrase
  category: Melody
  introducedIn: v3-03
  aliases: [antecedent, consequent, phrase structure, four-bar phrase, eight-bar phrase]
  def: >-
    A musical "sentence": a stretch of melody, often four or eight bars, that
    ends with a sense of arrival (a cadence). Phrases often come in pairs: an
    antecedent that ends open, answered by a consequent that ends closed.

- id: melodic-sequence
  term: Sequence
  category: Melody
  introducedIn: v3-03
  aliases: [melodic sequence, melodic sequences]
  def: >-
    A melodic figure repeated straight away at a different pitch level,
    usually stepping down or up each time. A staple of Baroque music and of pop
    melodies alike.

- id: melodic-transformation
  term: Transposition, inversion, retrograde
  category: Melody
  introducedIn: v3-03
  aliases: [transposition, transpose, transposed, inversion, retrograde, augmentation, diminution]
  def: >-
    Ways of changing a melody while keeping a recognizable relation to it:
    transposition moves every note by the same interval; inversion turns every
    interval upside down; retrograde plays it backwards; augmentation and
    diminution stretch or squeeze its rhythm.

- id: ornament
  term: Ornament
  category: Melody
  introducedIn: v3-03
  aliases: [ornament, ornaments, ornamentation, ornamented, melisma, melismas, melismatic, grace note, grace notes, mordent, meend, gamak]
  def: >-
    Decoration of a melody note: a quick neighboring note (grace note, trill,
    mordent), a slide between notes, or many notes sung on one syllable
    (melisma). In some traditions (rāga, maqām, Irish music) ornaments are part
    of a melody's identity, not optional extras.

# ---------- synthesis (v4-05) ----------
- id: synthesizer
  term: Synthesizer
  category: Synthesis
  introducedIn: v4-05
  aliases: [synth, synths, modular synth, modular synthesizer, Moog, Minimoog]
  def: >-
    An instrument that generates sound electronically from scratch, by building
    and shaping waveforms, rather than by recording an acoustic source.

- id: oscillator
  term: Oscillator
  category: Synthesis
  introducedIn: v4-05
  aliases: [oscillator, oscillators, sawtooth, square wave, square waves, triangle wave, triangle waves, VCO]
  def: >-
    The part of a synthesizer that produces a repeating waveform at a chosen
    frequency. Classic shapes are the sine, triangle, square, and sawtooth, each
    with a different recipe of harmonics.

- id: filter
  term: Filter
  category: Synthesis
  introducedIn: v4-05
  aliases: [low-pass, lowpass, high-pass, highpass, cutoff frequency, cutoff, filter sweep, resonant filter, VCF]
  def: >-
    A circuit or algorithm that reduces some frequencies and lets others
    through. A low-pass filter removes harmonics above its cutoff frequency,
    making the sound darker; resonance boosts the frequencies right at the
    cutoff.

- id: envelope
  term: Envelope (ADSR)
  category: Synthesis
  introducedIn: v4-05
  aliases: [ADSR, envelopes, amplitude envelope, filter envelope, envelope generator]
  def: >-
    How a sound's loudness (or brightness, or any other setting) changes over
    the course of a note. Synthesizers describe it with four settings: Attack
    (time to reach full level), Decay (time to fall to the sustain level),
    Sustain (the level held while the key is down), and Release (time to fade
    after the key is let go).

- id: subtractive-synthesis
  term: Subtractive synthesis
  category: Synthesis
  introducedIn: v4-05
  aliases: [subtractive synthesis, subtractive synth, subtractive]
  def: >-
    Start with a waveform rich in harmonics (sawtooth, square), then carve it
    with a filter, shaping both with envelopes. The method of the Moog and most
    analog synthesizers.

- id: additive-synthesis
  term: Additive synthesis
  category: Synthesis
  introducedIn: v4-05
  aliases: [additive synthesis, additive synth]
  def: >-
    Build a sound by adding sine waves (partials) together, each with its own
    frequency and amplitude, and often its own envelope. Fourier's idea, run in
    reverse.

- id: fm-synthesis
  term: FM synthesis
  category: Synthesis
  introducedIn: v4-05
  aliases: [FM synthesis, frequency modulation, FM, sideband, sidebands, modulation index, carrier, modulator, DX7]
  def: >-
    Make one oscillator (the carrier) wobble in frequency at an audio rate,
    driven by another (the modulator). The wobbling adds sidebands, new
    frequencies spaced by the modulator's frequency, so two sine waves can
    produce a rich spectrum. Invented by John Chowning; made famous by the
    Yamaha DX7 (1983).

- id: physical-modeling
  term: Physical modeling
  category: Synthesis
  introducedIn: v4-05
  aliases: [physical modeling, physical modelling, physical model, physical models, Karplus-Strong, Karplus–Strong, waveguide]
  def: >-
    Synthesis by simulating the physics of an instrument (a string, a tube,
    a drumhead) and letting the sound emerge from the simulation.

- id: granular-wavetable
  term: Granular and wavetable synthesis
  category: Synthesis
  introducedIn: v4-05
  aliases: [granular synthesis, granular, grains, wavetable, wavetables, wavetable synthesis]
  def: >-
    Two digital methods. Wavetable synthesis steps or morphs through a stored
    series of single-cycle waveforms, so the timbre can move. Granular synthesis
    builds sound from thousands of tiny snippets (grains) of a recording, a few
    milliseconds each, which can be scattered, stretched, and layered.

- id: lfo
  term: LFO (low-frequency oscillator)
  category: Synthesis
  introducedIn: v4-05
  aliases: [LFO, LFOs, low-frequency oscillator]
  def: >-
    An oscillator running too slowly to hear as a pitch (below about 20 Hz),
    used to wobble another setting: pitch (vibrato), loudness (tremolo), or
    filter cutoff.


# ---------- v4-08: Mixing and mastering ----------
- id: mixing
  term: Mixing
  category: Production
  introducedIn: v4-08
  aliases: [mixing desk, mixing desks, mixing console, mixdown, mix engineer, mix engineers]
  def: >-
    Combining the recorded or synthesized parts of a piece into one finished
    stereo track. The engineer sets each part's level, its place between the
    speakers, its tone (EQ), and its sense of distance (reverb). Then the parts
    are processed together. Mixing decides what the listener can hear, and how
    clearly.

- id: eq
  term: EQ (equalization)
  category: Production
  introducedIn: v4-08
  aliases: [EQ, EQs, EQed, EQ'd, equalization, equalisation, equalizer, equaliser, low cut, low-cut, high cut, high-cut]
  def: >-
    Filters used to shape a recorded part's tone: boosting or cutting a range
    of frequencies, or removing everything below (a low cut) or above (a high
    cut) some point. It is the same physics as a synthesizer's filter. In a mix,
    though, EQ is mostly used to stop parts from masking each other.

- id: compressor
  term: Compression (dynamic range)
  category: Production
  introducedIn: v4-08
  aliases: [compressor, compressors, compressed dynamics, dynamic range compression, bus compression, gain reduction, limiter, limiters, limiting]
  def: >-
    Automatic turning-down of loud moments. Above a threshold level, a
    compressor reduces the excess by a ratio (at 4:1, 4 dB over comes out as 1
    dB over). Attack and release set how quickly it reacts and lets go. A
    limiter is a compressor with a very high ratio, used as a ceiling. Not to be
    confused with the compressions of a sound wave.

- id: reverb
  term: Reverb
  category: Production
  introducedIn: v4-08 # chapter 4.7 (recording and space) will treat it in depth
  aliases: [reverb, reverbs, reverberation, reverberant, plate reverb, spring reverb]
  def: >-
    The dense wash of reflections a sound makes in a room after the direct sound
    stops. In a mix it is usually added artificially (by an echo chamber, a metal
    plate, a spring, or a digital model). More reverb relative to the direct
    sound makes a part seem further away.

- id: sidechain
  term: Sidechain ducking
  category: Production
  introducedIn: v4-08
  aliases: [sidechain, sidechains, side-chain, sidechained, sidechaining, ducking]
  def: >-
    Letting one part control the processing of another. Typically the kick drum
    triggers a compressor on the bass or the whole mix, which "ducks" out of the
    kick's way on every beat. Exaggerated, the ducking becomes an audible
    pumping, a signature sound of French house and EDM.

- id: headroom
  term: Headroom and clipping
  category: Production
  introducedIn: v4-08
  aliases: [headroom, clipping, digital clipping, 0 dBFS, dBFS]
  def: >-
    A digital recording has a hard ceiling (0 dBFS, "decibels relative to full
    scale"). A signal pushed past it is clipped: its peaks are sliced flat, which
    sounds like harsh distortion. Headroom is the gap between a mix's peaks and
    that ceiling.

- id: crest-factor
  term: Crest factor
  category: Production
  introducedIn: v4-08
  aliases: [crest factor, peak-to-average ratio, peak-to-average]
  def: >-
    The difference, in decibels, between a signal's peaks and its average
    level. Drum hits and dynamic playing give a high crest factor. Heavy
    compression and limiting shrink it, so the waveform looks like a solid
    block.

- id: mastering
  term: Mastering
  category: Production
  introducedIn: v4-08
  aliases: [mastering, mastering engineer, mastering engineers, remaster, remastered, remastering]
  def: >-
    The last stage before release. A mastering engineer adjusts the finished
    stereo mix as a whole (overall EQ, compression, limiting to set the final
    loudness), matches the tracks of an album to one another, and prepares the
    files for each format.

- id: loudness-normalization
  term: Loudness war and loudness normalization
  category: Production
  introducedIn: v4-08
  aliases: [loudness war, loudness wars, loudness normalization, loudness normalisation, LUFS, LKFS]
  def: >-
    From the 1990s, records were mastered ever louder with heavy limiting, on
    the theory that louder sounds better: the loudness war. Streaming services
    now measure each track's average loudness (in LUFS, a frequency-weighted
    average) and turn loud tracks down to a common target. That removes most
    of the reward for squashing a master.

# ---------- Atlas: I Feel Love (v7-01) ----------
# Production terms the Atlas needs before Vol IV's recording chapters exist.
# When 4.6/4.7 are written, move introducedIn there and add them to v7-01's assumes.
# v4-08: delay-effect, stereo-panning, multitrack-recording now introduced in v4-08 (mixing).
- id: delay-effect
  term: Delay (echo effect)
  category: Production
  introducedIn: v4-08 # v4-08: moved from v7-01
  aliases: [delay effect, delay effects, tape delay, echo effect, delayed copy]
  def: >-
    An effect that records a sound and plays it back a fixed time later, mixed
    with the original. A single repeat set to a note value (say, a sixteenth)
    turns into rhythm: the echoes land on the grid.

- id: stereo-panning
  term: Stereo and panning
  category: Production
  introducedIn: v4-08 # v4-08: moved from v7-01
  aliases: [stereo, panning, panned, pan position, hard left, hard right, stereo image, stereo width] # v4-08: + stereo image/width
  def: >-
    Stereo recordings have two channels, one per speaker or ear. Panning places
    a sound between them: all left, all right, or anywhere in between, so it
    seems to come from that direction.

- id: click-track
  term: Click track (sync track)
  category: Production
  introducedIn: v2-01 # v2-01: was v7-01 (tempo stability); v7-01 covers the tape sync track
  deepIn: v7-01
  aliases: [click track, click tracks, sync track, sync pulse]
  def: >-
    A steady electronic pulse recorded alongside the music, so that players or
    machines can lock to exactly the same tempo. In early electronic studios a
    pulse recorded on one tape track drove the sequencer each time it played.

- id: multitrack-recording
  term: Multitrack recording
  category: Production
  introducedIn: v4-08 # v4-08: moved from v7-01
  aliases: [multitrack, multi-track, multitrack recording, overdub, overdubs, overdubbed, overdubbing]
  def: >-
    Recording each part onto its own track of the same tape (or file), so parts
    can be added one at a time (overdubbing) and balanced later in the mix.

- id: head-voice
  term: Head voice and chest voice
  category: Sound
  introducedIn: v7-01
  aliases: [head voice, chest voice, falsetto]
  def: >-
    Two ways of using the vocal folds. Chest voice, the normal speaking
    register, is full and strong; head voice, higher up, is lighter, with fewer
    strong upper harmonics. Falsetto is a still lighter head-voice sound.

# ---------- v3-05: vertical harmony ----------
- id: diatonic-chords
  term: Diatonic chords (chords from a scale)
  category: Chords
  introducedIn: v3-05
  deepIn: v3-06
  aliases: [diatonic, diatonic chord, diatonic chords, stacked thirds, stacking thirds, stack of thirds, tertian]
  def: >-
    The chords you get by stacking thirds using only the notes of one scale:
    start on any scale note and take every other note. In a major key this
    gives three major triads (I, IV, V), three minor (ii, iii, vi), and one
    diminished (vii°).

- id: chord-quality
  term: Chord quality (major, minor, diminished, augmented)
  category: Chords
  introducedIn: v3-05
  aliases: [diminished, augmented, diminished triad, augmented triad, chord quality, chord qualities]
  def: >-
    The type of a chord, set by the sizes of its stacked thirds. Major: major
    third then minor third. Minor: minor then major. Diminished: two minor
    thirds (its fifth is a tritone). Augmented: two major thirds.

- id: roman-numerals
  term: Roman numerals
  category: Chords
  introducedIn: v3-05
  deepIn: v3-06
  aliases: [Roman numeral, Roman numerals]
  def: >-
    Names for chords by the scale degree of their root, so the same label works
    in any key: I is the chord on the first degree, V on the fifth. Capitals
    for major chords, lower case for minor, ° for diminished.

- id: chord-inversion
  term: Inversion (of a chord)
  category: Chords
  introducedIn: v3-05
  aliases: [root position, first inversion, second inversion, third inversion, slash chord, slash chords]
  def: >-
    Which chord tone is in the bass. Root position has the root lowest; first
    inversion the third; second inversion the fifth. A slash chord symbol like
    C/E means a C chord with E in the bass. Not the same as melodic inversion
    (flipping a melody upside down).

- id: seventh-chord
  term: Seventh chords
  category: Chords
  introducedIn: v3-05
  aliases: [seventh chords, major seventh chord, minor seventh chord, half-diminished, diminished seventh, maj7]
  def: >-
    A triad with one more third stacked on top, adding a seventh above the
    root. The common types: major seventh (Cmaj7), dominant seventh (C7), minor
    seventh (Cm7), half-diminished (Cm7♭5), and diminished seventh (C°7).

- id: chord-symbol
  term: Chord symbols and lead sheets
  category: Chords
  introducedIn: v3-05
  aliases: [chord symbol, chord symbols, lead sheet, lead sheets]
  def: >-
    Shorthand names for chords written above a melody: a root letter plus a
    suffix for the quality (C, Cm, C7, Cmaj7, C°). A lead sheet is a melody with
    chord symbols, the standard score in jazz and pop; the player chooses the
    voicing.

- id: voice-leading
  term: Voice leading
  category: Chords
  introducedIn: v3-05
  deepIn: v3-08
  aliases: [voice leading, common tone, common tones, contrary motion, oblique motion, similar motion, parallel motion, parallel fifths, voice crossing]
  def: >-
    How the individual notes of one chord move to the notes of the next, heard
    as separate lines (voices). Good voice leading keeps common tones, moves the
    other voices by small steps, and avoids parallel fifths and octaves, which
    make two voices fuse into one.

- id: quartal
  term: Quartal harmony
  category: Chords
  introducedIn: v3-05
  aliases: [quartal, quartal harmony, stacked fourths]
  def: >-
    Chords built by stacking fourths instead of thirds. Open and ambiguous, with
    no clear major or minor quality; a signature of modal jazz from the late
    1950s on.

# ---------- v3-06: functional harmony ----------
- id: harmonic-function
  term: Harmonic function (tonic, predominant, dominant)
  category: Harmony & style
  introducedIn: v3-06
  aliases: [harmonic function, harmonic functions, tonic function, predominant, pre-dominant, subdominant, phrase model]
  def: >-
    The job a chord does in a key, which falls into three families. Tonic
    chords (I, and often vi) are stable: home. Predominant chords (IV, ii) lead
    away from home toward the dominant. Dominant chords (V, V7, vii°) pull back
    to the tonic. A typical phrase runs tonic, predominant, dominant, tonic.

- id: leading-tone
  term: Leading tone
  category: Harmony & style
  introducedIn: v3-06
  aliases: [leading tone, leading tones, leading note, leading-tone]
  def: >-
    The seventh note of the major scale (B in C major), a semitone below the
    tonic. It sits in the dominant chord and tends to rise to the tonic, which
    is a large part of why the dominant pulls toward home.

- id: circle-of-fifths
  term: Circle of fifths
  category: Harmony & style
  introducedIn: v3-02 # v3-02: was v3-06; 3.2 builds it from stacked fifths, 3.6 uses it for harmony
  deepIn: v3-06
  aliases: [circle of fifths, cycle of fifths, falling fifths, descending fifths, root motion]
  def: >-
    The twelve notes arranged so that neighbors are a fifth apart (C G D A E B
    F♯ D♭ A♭ E♭ B♭ F, and back to C). Neighboring keys share six of their
    seven notes. In tonal harmony, chord roots most often fall by a fifth, one
    step around the circle toward the tonic (D→G→C).

- id: secondary-dominant
  term: Secondary dominant
  category: Harmony & style
  introducedIn: v3-06
  aliases: [secondary dominant, secondary dominants, applied dominant, applied dominants, tonicization, tonicize, tonicizes, tonicized]
  def: >-
    A dominant chord borrowed to point at a chord other than the tonic. In C
    major, D7 is the dominant of G (written V/V) and E7 the dominant of A minor
    (V/vi). Briefly treating a chord as a temporary home this way is called
    tonicization.

- id: borrowed-chord
  term: Borrowed chord (modal mixture)
  category: Harmony & style
  introducedIn: v3-06
  aliases: [borrowed chord, borrowed chords, modal mixture]
  def: >-
    A chord taken from the parallel minor key or a neighboring mode while
    staying in a major key: in C major, F minor (iv), A♭ (♭VI), or B♭ (♭VII).
    Rock leans heavily on ♭VII.

- id: harmonic-loop
  term: Chord loop
  category: Harmony & style
  introducedIn: v3-06
  aliases: [chord loop, chord loops, harmonic loop, harmonic loops]
  def: >-
    A short progression repeated over and over (I–V–vi–IV, for example) instead
    of one that drives toward a cadence. Common in pop since the 1990s; the
    chords' functions can blur, because the loop has no beginning or end.

- id: harmonic-rhythm
  term: Harmonic rhythm
  category: Harmony & style
  introducedIn: v3-06
  aliases: [harmonic rhythm]
  def: >-
    How often the chords change. A speeding-up harmonic rhythm (one chord per
    bar, then two) is a common way to push toward a cadence.

# ---------- v2-03: subdivision, accent, grouping ----------

- id: note-values
  term: Note values (whole, half, quarter...)
  category: Rhythm
  introducedIn: v2-03
  aliases: [crotchet, crotchets, quaver, quavers, semiquaver, semiquavers, minim, minims, dotted note, dotted notes, dotted quarter, dotted rhythm, dotted rhythms]
  def: >-
    The names for durations: a whole note splits into two halves, four
    quarters, eight eighths, sixteen sixteenths. In 4/4 the beat is a quarter
    note. A dot adds half the value again (a dotted quarter lasts three
    eighths). British names: semibreve, minim, crotchet, quaver, semiquaver.

- id: tuplet
  term: Tuplets (triplets against duple time)
  category: Rhythm
  introducedIn: v2-03
  aliases: [tuplet, tuplets, quintuplet, quintuplets, duplet, duplets, triplet feel]
  def: >-
    Squeezing an "irregular" number of equal notes into a span the meter
    normally divides differently: three in the time of two (a triplet), five
    in the time of four (a quintuplet), two in the time of three (a duplet).

- id: half-time-feel
  term: Half-time and double-time feel
  category: Rhythm
  introducedIn: v2-03
  aliases: [half-time, double-time, half-time feel, double-time feel]
  def: >-
    Changing which pulse feels like the beat without changing the tempo of the
    underlying grid. In half-time the backbeat moves from beats 2 and 4 to
    beat 3, so the music feels half as fast; in double-time it lands on every
    off-beat eighth, so it feels twice as fast.

- id: accent
  term: Accent (dynamic, agogic, tonal, metrical)
  category: Rhythm
  introducedIn: v2-03
  aliases: [dynamic accent, dynamic accents, agogic accent, agogic accents, tonal accent, tonal accents, metrical accent, metrical accents, phenomenal accent, phenomenal accents]
  def: >-
    Anything that makes one note stand out from its neighbors: being louder
    (dynamic), longer (agogic), higher or after a leap (tonal), on a chord
    change, or in a new instrument. These "phenomenal" accents are in the
    sound; a metrical accent is the strength a position has in the listener's
    meter, whether or not anything is played there.

- id: rhythmic-anticipation
  term: Anticipation (a pushed note)
  category: Rhythm
  introducedIn: v2-03
  aliases: [rhythmic anticipation, rhythmic anticipations, pushed note, pushed notes, pushed beat, pushed beats, pushed chord, pushed chords]
  def: >-
    A note or chord that arrives a sixteenth or eighth before the strong beat
    it belongs to and is held through it. The most common syncopation in pop
    and rock: the listener hears it as the on-beat note, early.

- id: rhythmic-grouping
  term: Rhythmic grouping
  category: Rhythm
  introducedIn: v2-03
  aliases: [rhythmic grouping, grouping structure, grouping structures]
  def: >-
    How notes are heard as belonging together in units (motives, phrases,
    sections), separate from the meter. Groups can start and end anywhere in
    the bar; meter says which positions are strong, grouping says which notes
    go together.

- id: anacrusis
  term: Pickup (anacrusis)
  category: Rhythm
  introducedIn: v2-03
  aliases: [anacrusis, anacruses, pickup note, pickup notes, pickup beat, pickup bar]
  def: >-
    One or more notes before the first downbeat of a phrase, as in the
    "Happy" of "Happy Birthday". The phrase starts before the bar does.

- id: additive-meter
  term: Additive meter
  category: Rhythm
  introducedIn: v2-03
  aliases: [additive meter, additive meters, additive rhythm, additive rhythms, aksak, odd meter, odd meters, asymmetric meter, asymmetric meters]
  def: >-
    A meter whose beats are unequal groups of a fast pulse, such as 7/8 as
    2 + 2 + 3 or 5/4 as 3 + 2, common in Balkan, Turkish, and Indian music and
    in progressive rock and jazz. Distinct from a 3 + 3 + 2 rhythm played over
    an even 4/4 beat.

# ---------- v3-08: counterpoint and texture ----------
# Bare "polyphony" and "polyphonic" are deliberately not aliases of
# polyphony: earlier chapters use them loosely ("European polyphony") and
# synth chapters use "polyphonic" for instruments that play chords.

- id: monophony
  term: Monophony
  category: Form & tension
  introducedIn: v3-08
  aliases: [monophony, monophonic texture]
  def: >-
    A texture with a single melodic line and nothing else: a chant, a solo
    folk song, a crowd singing one tune in unison or octaves.

- id: heterophony
  term: Heterophony
  category: Form & tension
  introducedIn: v3-08
  aliases: [heterophony, heterophonic]
  def: >-
    Several performers playing or singing the same tune at the same time, each
    decorating or varying it in their own way, so the versions rub against each
    other. Central to gamelan, Arabic and Turkish ensembles, and Irish sessions.

- id: homophony
  term: Homophony
  category: Form & tension
  introducedIn: v3-08
  aliases: [homophony, homophonic]
  def: >-
    A texture where one line leads and the other parts move with it as chords,
    mostly in the same rhythm: a hymn, a barbershop quartet, or (loosely) any
    melody with chordal accompaniment.

- id: polyphony
  term: Polyphony
  category: Form & tension
  introducedIn: v3-08
  aliases: [polyphonic texture, polyphonic textures, contrapuntal texture]
  def: >-
    A texture of two or more independent lines, each with its own contour and
    rhythm, that the ear can follow separately. Writing it is counterpoint.

- id: species-counterpoint
  term: Species counterpoint
  category: Harmony & style
  introducedIn: v3-08
  aliases: [species counterpoint, first species, second species, third species, fourth species, fifth species]
  def: >-
    A graded method for learning counterpoint, codified by Johann Joseph Fux in
    1725: write a line against a given cantus firmus, first note against note
    (first species), then two notes, four notes, syncopated notes, and finally
    free rhythms (fifth species).

- id: cantus-firmus
  term: Cantus firmus
  category: Harmony & style
  introducedIn: v3-08
  aliases: [cantus firmus, cantus firmi]
  def: >-
    "Fixed song": a given melody, usually in long even notes, against which
    other voices are written. Medieval and Renaissance composers built whole
    masses on borrowed chant or song tunes this way; species counterpoint uses
    one as the exercise's starting point.

- id: imitation
  term: Imitation
  category: Harmony & style
  introducedIn: v3-08
  aliases: [imitative, in imitation, imitative counterpoint, point of imitation, points of imitation]
  def: >-
    One voice repeats a figure just played by another, while the first voice
    carries on with something else. The basic device of Renaissance vocal
    polyphony, fugue, and call-and-answer textures.

- id: canon
  term: Canon and round
  category: Harmony & style
  introducedIn: v3-08
  aliases: [canons, a canon, in canon, strict canon, a round, rounds]
  def: >-
    Strict imitation: a whole melody is sung or played against delayed copies
    of itself. A round is a canon at the same pitch that can loop back to the
    start indefinitely ("Frère Jacques", "Row, Row, Row Your Boat"). Canons can
    also enter at other intervals or with the follower inverted.

- id: fugue
  term: Fugue
  category: Harmony & style
  introducedIn: v3-08
  aliases: [fugue, fugues, fugal, countersubject, fugue subject]
  def: >-
    A piece (or procedure) built from imitation of one short theme, the
    subject. Voices enter one at a time with it, alternately on the home key's
    tonic and its fifth (the answer); later the subject returns in different
    keys and voices, separated by freer episodes.

- id: invertible-counterpoint
  term: Invertible counterpoint
  category: Harmony & style
  introducedIn: v3-08
  aliases: [invertible counterpoint, double counterpoint]
  def: >-
    Two lines written so that either one can go on top: swap them (usually by
    moving one an octave) and the combination still works. Fugue composers rely
    on it so a subject and its countermelody can be reused in any arrangement.

# ---------- v3-04: tonal centers, modes, and pitch hierarchies ----------
- id: tonal-hierarchy
  term: Tonal hierarchy
  category: Harmony & style
  introducedIn: v3-04
  aliases: [tonal hierarchy, tonal hierarchies, probe tone, probe tones, probe-tone, key profile, key profiles, key-finding]
  def: >-
    The ranking of notes by how stable they sound in a key. In the probe-tone
    experiments, listeners rate the tonic as fitting best, then the fifth and
    third, then the other scale notes, then the notes outside the scale. The
    ranking mirrors how often and how long each note occurs in the music
    listeners know, and it differs between musical cultures.

- id: mode
  term: Modes (Dorian, Mixolydian, and the rest)
  category: Harmony & style
  introducedIn: v3-04
  aliases: [Dorian, Mixolydian, Lydian, Phrygian, Aeolian, Ionian, Locrian, church modes, modal]
  def: >-
    The seven scales you get by keeping the white keys and choosing a
    different one as home. Ionian is the major scale, Aeolian the natural
    minor; Dorian is minor with a raised 6th, Mixolydian major with a lowered
    7th, Lydian major with a raised 4th, Phrygian minor with a lowered 2nd.

- id: parallel-key
  term: Parallel major and minor
  category: Harmony & style
  introducedIn: v3-04
  aliases: [parallel major, parallel minor, parallel key, parallel keys, parallel mode, parallel modes]
  def: >-
    A major key and a minor key (or any two modes) on the same tonic, such as
    C major and C minor. They share home but differ in some notes. Compare the
    relative major and minor, which share notes but not home.

- id: drone
  term: Drone
  category: Harmony & style
  introducedIn: v3-04
  aliases: [drone, drones]
  def: >-
    A note (often with its fifth) sustained for a whole piece or section, as
    under an Indian raga or from a bagpipe's drone pipes. It names home
    constantly, so every other note is heard against it.

- id: pentatonic
  term: Pentatonic scale
  category: Notes & intervals
  introducedIn: v3-04 # v3-02 (why scales exist) may take this over once written
  aliases: [pentatonic, pentatonic scale, pentatonic scales]
  def: >-
    A five-note scale. The common one is the black keys, or C D E G A: the
    major scale without its two half steps. It turns up in folk music
    worldwide, in blues and rock (the minor pentatonic), and in East Asian music.


# ---- v2-04 (polyrhythm) ----

- id: polyrhythm
  term: Polyrhythm
  category: Rhythm
  introducedIn: v2-04
  aliases: [polyrhythm, polyrhythms, polyrhythmic, composite rhythm, composite rhythms, three against two, four against three, 3 against 2, 4 against 3]
  def: >-
    Two (or more) steady pulses at once that divide the same span of time
    into different numbers of equal parts, such as 3 against 2: three evenly
    spaced notes in one part while another plays two. The notes of all the
    parts together make the composite rhythm.

- id: cross-rhythm
  term: Cross-rhythm
  category: Rhythm
  introducedIn: v2-04
  aliases: [cross-rhythm, cross-rhythms, cross rhythm, cross rhythms, cross-rhythmic]
  def: >-
    A rhythm whose pulse or grouping cuts across the meter the listener holds,
    so it is heard against the beat rather than as a second beat of equal
    standing. In much West African music, cross-rhythm against the dancers'
    beat is the normal texture, not an effect.

- id: polymeter
  term: Polymeter
  category: Rhythm
  introducedIn: v2-04
  aliases: [polymeter, polymeters, polymetric, polymetre, polymetrical]
  def: >-
    Patterns of different lengths built on the same fast pulse, repeating
    together so that they drift apart and realign: a 3-step loop against a
    4-step loop lines up again every 12 steps. The pulse is shared; the cycle
    lengths differ. Compare polyrhythm, where the pulses themselves differ.

- id: timeline-pattern
  term: Timeline pattern
  category: Rhythm
  introducedIn: v2-04
  aliases: [timeline pattern, timeline patterns, time-line pattern, time-line patterns]
  def: >-
    A short, asymmetric pattern, usually played on a bell or sticks, that
    repeats unchanged through a piece and orients every other part, as in
    the 12-pulse bell pattern of Ewe music or the Cuban clave.

- id: phasing
  term: Phasing (phase music)
  category: Rhythm
  introducedIn: v2-04
  aliases: [phasing, phase music, phase shifting, phase-shifting, phase process]
  def: >-
    Steve Reich's process of playing a repeating pattern against a copy of
    itself while one copy gradually (or step by step) moves ahead, so the two
    pass through every offset in turn and each offset produces a new
    composite pattern.

- id: metric-modulation
  term: Metric modulation
  category: Rhythm
  introducedIn: v2-04
  aliases: [metric modulation, metrical modulation, metric modulations]
  def: >-
    A tempo change made by reinterpreting a note value: a triplet in the old
    tempo becomes the new beat, so the music speeds up or slows down by an
    exact ratio. Associated with Elliott Carter.

- id: ostinato
  term: Ostinato and ground bass
  category: Rhythm
  introducedIn: v2-04
  deepIn: v5-02
  aliases: [ostinato, ostinatos, ostinati, ground bass, ground basses, basso ostinato]
  def: >-
    A short pattern repeated persistently, often unchanged, while other parts
    change around it. A bass line or riff repeated through a song is an
    ostinato; a ground bass is an ostinato in the bass, the basis of many
    Baroque laments and variation sets.

# ---------- v2-01: musical time ----------
- id: inter-onset-interval
  term: Onset and inter-onset interval (IOI)
  category: Rhythm
  introducedIn: v2-01
  aliases: [inter-onset interval, inter-onset intervals, IOI, IOIs]
  def: >-
    An onset is the moment a sound event starts. The inter-onset interval is
    the time from one onset to the next. Rhythm, as the ear tracks it, is
    mostly a pattern of inter-onset intervals, not of note lengths.

- id: simple-compound-meter
  term: Simple and compound meter
  category: Rhythm
  introducedIn: v2-01
  deepIn: v2-02
  aliases: [simple meter, simple meters, compound meter, compound meters, simple time, compound time]
  def: >-
    In simple meter each beat divides into two (2/4, 3/4, 4/4). In compound
    meter each beat divides into three (6/8, 9/8, 12/8), so 6/8 is felt as two
    beats of three eighth notes each, not six beats.

- id: tempo-marking
  term: Tempo marking (Allegro, Andante…)
  category: Rhythm
  introducedIn: v2-01
  aliases: [tempo marking, tempo markings, tempo indication, tempo indications, metronome marking, metronome markings]
  def: >-
    A word at the top of a score describing the speed and character of the
    music, traditionally in Italian: Largo (broad), Andante (walking), Allegro
    (cheerful), Presto (very fast). Since the early 1800s often paired with a
    metronome marking in beats per minute.

- id: expressive-timing
  term: Expressive timing (rubato)
  category: Rhythm
  introducedIn: v2-01
  aliases: [expressive timing, rubato, tempo rubato, phrase-final lengthening, final lengthening]
  def: >-
    Systematic deviations from strict tempo that performers use to shape the
    music: pushing ahead within a phrase, slowing into its end, lingering on
    important notes. Called rubato ("robbed" time) in classical playing.

- id: tempo-change
  term: Accelerando and ritardando
  category: Rhythm
  introducedIn: v2-01
  aliases: [accelerando, accelerandos, ritardando, ritardandos, rallentando, ritard]
  def: >-
    A gradual change of tempo written into the music: accelerando means
    getting faster, ritardando (or rallentando) getting slower, typically at
    the end of a piece or section.

# ---------- v3-01: intervals, ratios, and how precisely we hear and tune them ----------

- id: interval-quality
  term: Interval quality (perfect, major, minor, augmented, diminished)
  category: Notes & intervals
  introducedIn: v3-01
  aliases: [interval quality, interval qualities, perfect interval, perfect intervals, augmented fourth, diminished fifth, augmented interval, augmented intervals, diminished interval, diminished intervals]
  def: >-
    The word in front of an interval's number. Unisons, fourths, fifths, and
    octaves are perfect; seconds, thirds, sixths, and sevenths come in major
    (larger) and minor (smaller) sizes. Stretching an interval a semitone
    beyond major or perfect makes it augmented; shrinking it a semitone below
    minor or perfect makes it diminished. The tritone is an augmented fourth
    or a diminished fifth, depending on spelling.

- id: enharmonic
  term: Enharmonic
  category: Notes & intervals
  introducedIn: v3-01
  aliases: [enharmonic, enharmonically, enharmonic equivalent, enharmonic equivalents]
  def: >-
    Two spellings of the same key on an equal-tempered keyboard: F♯ and G♭,
    or an augmented fourth (C–F♯) and a diminished fifth (C–G♭). They sound
    identical on a piano but play different roles in the music, and singers
    or string players may tune them slightly differently.

- id: compound-interval
  term: Compound interval
  category: Notes & intervals
  introducedIn: v3-01
  aliases: [compound interval, compound intervals, simple interval, simple intervals]
  def: >-
    An interval larger than an octave, named by continuing the letter count:
    a ninth is a second plus an octave, a tenth a third plus an octave, a
    twelfth a fifth plus an octave. Intervals within an octave are simple.
    In ratios, adding an octave doubles the ratio (5/4 → 5/2).

- id: interval-inversion
  term: Interval inversion
  category: Notes & intervals
  introducedIn: v3-01
  aliases: [interval inversion, interval inversions, inverting an interval, inverted interval, inverted intervals, inversion of an interval]
  def: >-
    Flipping an interval by moving its lower note up an octave (or its upper
    note down one). The two intervals add up to an octave: the numbers sum to
    9 (a third inverts to a sixth), the semitones to 12, the cents to 1,200,
    and the ratios multiply to 2/1. Major becomes minor, augmented becomes
    diminished, and perfect stays perfect.

- id: interval-class
  term: Interval class
  category: Notes & intervals
  introducedIn: v3-01
  aliases: [interval class, interval classes]
  def: >-
    An interval and its inversion (and any compound version) treated as one
    thing, measured by the shorter way round: 1 to 6 semitones. A major third,
    a minor sixth, and a major tenth all belong to interval class 4. Used
    where octave and direction don't matter, as in analysing post-tonal music.

- id: categorical-perception
  term: Categorical perception (of intervals)
  category: Hearing
  introducedIn: v3-01
  aliases: [categorical perception, perceived categorically, perceive intervals categorically]
  def: >-
    Hearing a continuum as a few distinct categories. Trained musicians label
    interval sizes between a minor and a major third as one or the other, with
    a fairly sharp switch near the middle, and tell sizes apart more easily
    across that boundary than within a category. The effect depends on
    training and is weaker than for speech sounds.

- id: intonation
  term: Intonation (expressive tuning)
  category: Tuning
  introducedIn: v3-01
  aliases: [expressive intonation, intonation practice, intonation practices]
  def: >-
    How performers who can bend pitch (singers, string and wind players)
    actually place their notes. Measurements show they match neither just
    ratios nor equal temperament exactly: they lock chords toward pure
    ratios, push notes that lead somewhere toward their goal, and vary by
    roughly ±10–20 cents from note to note.

- id: octave-stretch
  term: Octave stretch
  category: Tuning
  introducedIn: v3-01
  aliases: [octave stretch, octave stretching, stretched-octave preference]
  def: >-
    The tendency of listeners, when adjusting a melodic octave of pure tones
    (one note after the other), to set it slightly wider than an exact 2:1,
    typically by around 10–20 cents. It's a perceptual effect, separate from
    the stretched tuning of pianos, which comes from their strings' overtones.

- id: absolute-pitch
  term: Absolute and relative pitch
  category: Hearing
  introducedIn: v3-01
  aliases: [absolute pitch, perfect pitch, relative pitch]
  def: >-
    Relative pitch is hearing notes by their intervals from one another, which
    is how nearly everyone recognises a tune in any key. Absolute (perfect)
    pitch is naming or producing a note with no reference, such as hearing a
    car horn as an F. It's rare, and linked to early musical training and to
    speaking a tonal language. Most people still remember the usual pitch
    of familiar recordings within a semitone or two.

# ---------- repetition, variation, development (v5-02) ----------
# "fragmentation", "augmentation", "riff", and "development" are deliberately not
# aliases here: v3-03 introduces them in passing (under melodic-transformation and motif).
- id: variation
  term: Variation
  category: Form & tension
  introducedIn: v5-02
  aliases: [varied repetition, varied repetitions, variation technique, variation techniques]
  def: >-
    Repeating something with changes, so that it is recognizably the same
    material and recognizably different. A variation changes some dimensions
    (rhythm, harmony, mode, decoration, register, instrumentation) and keeps
    others; what's kept is what makes it recognizable.

- id: theme-and-variations
  term: Theme and variations
  category: Form & tension
  introducedIn: v5-02
  aliases: [theme and variations, variation form, variation set, variation sets, passacaglia, passacaglias, chaconne, chaconnes]
  def: >-
    A form made of a theme followed by a series of variations on it: A A′ A″
    A‴. In a passacaglia or chaconne, the variations are built over a short
    bass line or chord pattern that repeats throughout.

- id: motivic-development
  term: Motivic development and liquidation
  category: Form & tension
  introducedIn: v5-02
  aliases: [motivic development, thematic development, liquidation, liquidated, liquidates, motivic work]
  def: >-
    Building a passage by working over a motif: sequencing, inverting,
    stretching, recombining, and cutting it into fragments. Liquidation is
    the end point of fragmentation: the motif is pared down until only a
    rhythm or a single repeated note or chord is left.

- id: developing-variation
  term: Developing variation
  category: Form & tension
  introducedIn: v5-02
  aliases: [developing variation]
  def: >-
    Schoenberg's name for a way of composing in which each new idea grows out
    of a variation of an earlier one, so that a whole piece unfolds from a few
    small cells without literal repeats. He found it above all in Brahms.

- id: call-and-response
  term: Call and response
  category: Form & tension
  introducedIn: v5-02
  aliases: [call and response, call-and-response, antiphony, antiphonal]
  def: >-
    A phrase by one voice or group answered by another: a leader and a
    chorus, a singer and a guitar, two sections of a band. Central to West and
    Central African music and to the African American traditions that grew from
    it (work songs, gospel, blues, jazz, soul), and found in church music worldwide.

- id: musical-borrowing
  term: Quotation, sampling, and interpolation
  category: Form & tension
  introducedIn: v5-02
  aliases: [musical quotation, musical quotations, interpolation, interpolations, sample-based]
  def: >-
    Reusing material from another piece: quoting a recognizable tune, sampling
    a piece of an actual recording, or interpolating (re-recording) part of an
    older song in a new one. Variation that crosses from one piece to another.

# ---- v4-01: acoustic instruments as physical systems ----
- id: exciter-resonator
  term: Exciter, resonator, radiator
  category: Instruments
  introducedIn: v4-01
  aliases: [exciter, exciters, radiator, radiators]
  def: >-
    The three parts of almost every acoustic instrument. The exciter puts
    energy in (a bow, a pluck, a hammer, a reed, the lips, a stick). The
    resonator (a string, an air column, a drumhead, a bar) decides which
    frequencies vibrate. The radiator (a soundboard, a body, a bell) passes the
    vibration to the air.

- id: mode-locking
  term: Mode locking (self-sustained oscillation)
  category: Instruments
  introducedIn: v4-01
  aliases: [mode locking, mode-locked, mode-locks, self-sustained, self-sustaining]
  def: >-
    In bowed and blown instruments, the resonator controls the exciter: the
    string decides when the bow slips, the air column decides when the reed
    opens. This feedback holds every partial in an exact whole-number ratio,
    so a sustained note is perfectly harmonic even when the resonator's own
    modes are slightly out of line.

- id: helmholtz-motion
  term: Stick-slip and Helmholtz motion
  category: Instruments
  introducedIn: v4-01
  aliases: [stick-slip, Helmholtz motion, Helmholtz corner]
  def: >-
    How a bow drives a string. Rosin makes the hair grip the string and drag
    it along, until it snaps free and slides back, then grips again, once per
    period. The string takes the shape of a sharp corner racing around its
    length, and its sound is close to a sawtooth wave: every harmonic, at
    strength 1/n.

- id: open-closed-pipe
  term: Open and closed pipes
  category: Instruments
  introducedIn: v4-01
  aliases: [closed pipe, closed pipes, open pipe, open pipes, stopped pipe, stopped pipes, closed tube, open tube]
  def: >-
    A tube open at both ends (a flute) has every harmonic. A tube closed at
    one end (a clarinet, whose reed end acts closed) has only the odd
    harmonics, and its lowest note is an octave below an open tube of the same
    length.

- id: bore
  term: Bore (cylindrical or conical)
  category: Instruments
  introducedIn: v4-01
  aliases: [cylindrical bore, conical bore, conical bores, cylindrical bores]
  def: >-
    The shape of a wind instrument's inside. A cylinder closed at the reed end
    (clarinet) gives odd harmonics; a cone (oboe, bassoon, saxophone) behaves
    like an open pipe and gives all of them, even though it too is closed at
    the reed.

- id: reed
  term: Reeds and lip reeds
  category: Instruments
  introducedIn: v4-01
  aliases: [single reed, single-reed, double reed, double-reed, lip reed, lip reeds, buzzing lips]
  def: >-
    A valve that chops a steady stream of breath into pulses: a single cane
    reed against a mouthpiece (clarinet, saxophone), two blades beating
    together (oboe, bassoon), or a brass player's lips buzzing in the
    mouthpiece. The air column's pressure tells the valve when to open.

- id: overblowing
  term: Overblowing
  category: Instruments
  introducedIn: v4-01
  aliases: [overblow, overblows, overblowing, overblown, register key]
  def: >-
    Blowing harder or differently so a wind instrument jumps to a higher mode
    of its air column. A flute overblows to the octave (mode 2); a clarinet,
    lacking even harmonics, jumps to the twelfth (mode 3). Brass instruments
    play almost entirely by choosing modes this way.

- id: soundboard
  term: Soundboard and body
  category: Instruments
  introducedIn: v4-01
  aliases: [soundboard, soundboards, top plate, body resonances]
  def: >-
    A string barely moves any air by itself. It passes its vibration through a
    bridge to a large, light plate (a piano's soundboard, a violin's or
    guitar's top), which radiates it. The plate and the air inside the body
    have their own resonances, which color every note.

- id: sympathetic-resonance
  term: Sympathetic resonance
  category: Instruments
  introducedIn: v4-01
  aliases: [sympathetic resonance, sympathetic vibration, sympathetic strings, sympathetically]
  def: >-
    An undamped string (or other resonator) starting to vibrate because a
    nearby sound contains its frequencies. Pianos do it when the sustain
    pedal is down; sitars and the viola d'amore have extra strings just for it.

- id: membrane-modes
  term: Drumhead and plate modes
  category: Instruments
  introducedIn: v4-01
  aliases: [nodal diameter, nodal diameters, nodal circle, nodal circles, nodal line, nodal lines]
  def: >-
    A drumhead vibrates in patterns divided by still lines: diameters across it
    and circles around its center. Their frequencies follow no whole-number
    pattern (an ideal head's first modes are 1 : 1.59 : 2.14 : 2.30...), which
    is why most drums have no clear pitch. Timpani and tabla are built to bend
    them close to a harmonic series.

- id: bar-modes
  term: Bar modes and undercutting
  category: Instruments
  introducedIn: v4-01
  aliases: [undercut, undercutting, free bar, free bars]
  def: >-
    A uniform bar free at both ends has modes at 1 : 2.76 : 5.40 : 8.93, far
    from harmonic. Marimba and xylophone makers carve an arch under each bar
    to pull the upper modes onto chosen intervals (two octaves up on a
    marimba, an octave and a fifth on a xylophone).

- id: bell-partials
  term: Bell partials (hum, prime, tierce, nominal)
  category: Instruments
  introducedIn: v4-01
  aliases: [strike note, hum note, hum tone]
  def: >-
    The named modes of a tuned church bell: the hum an octave below the prime,
    the prime, a minor third above it (the tierce), a fifth, and the nominal an
    octave above the prime. The pitch you hear when it's struck (the strike
    note) is usually not any single mode.

- id: hornbostel-sachs
  term: Hornbostel–Sachs classification
  category: Instruments
  introducedIn: v4-01
  aliases: [Hornbostel–Sachs, Hornbostel-Sachs, chordophone, chordophones, aerophone, aerophones, membranophone, membranophones, idiophone, idiophones, electrophone, electrophones]
  def: >-
    The standard scheme for classifying instruments by what vibrates:
    chordophones (strings), aerophones (air), membranophones (stretched skins),
    idiophones (the body itself: bells, bars, rattles), and electrophones
    (electronic sound), added later. Devised by Erich von Hornbostel and Curt
    Sachs in 1914.
